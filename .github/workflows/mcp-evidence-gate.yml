name: MCP Evidence Gate Dogfood

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

env:
  CORE_SHA: 06567c840c1d68a4b45ff2d12d6e6c32898fff11

jobs:
  verify-evidence:
    name: case (${{ matrix.name }}, ${{ matrix.receipt }}, ${{ matrix.expected_decision }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: matching-clean
            receipt: evidence/clean/receipt.json
            policy: permissive
            expected_decision: pass
            expected_verdict: clean
            expected_outcome: success
          - name: warnings-permissive
            receipt: evidence/warnings/permissive.json
            policy: permissive
            expected_decision: warn
            expected_verdict: warnings
            expected_outcome: success
          - name: warnings-strict
            receipt: evidence/warnings/strict.json
            policy: strict-release-example
            expected_decision: fail
            expected_verdict: warnings
            expected_outcome: failure
          - name: digest-mismatch
            receipt: evidence/inconclusive/receipt.json
            policy: permissive
            expected_decision: inconclusive
            expected_verdict: clean
            expected_outcome: failure
          - name: stale
            receipt: evidence/inconclusive/stale.json
            policy: permissive
            expected_decision: inconclusive
            expected_verdict: clean
            expected_outcome: failure
          - name: findings
            receipt: evidence/fail/findings.json
            policy: permissive
            expected_decision: fail
            expected_verdict: findings
            expected_outcome: failure
          - name: malformed-receipt
            receipt: evidence/fail/malformed.json
            policy: permissive
            expected_decision: fail
            expected_outcome: failure
            expected_verdict: clean
          - name: explicit-evidence-match-permissive
            receipt: evidence/clean/evidence-match-receipt.json
            evidence: evidence/clean/evidence-report.json
            policy: permissive
            expected_decision: pass
            expected_verdict: clean
            expected_outcome: success
          - name: explicit-evidence-mismatch-permissive
            receipt: evidence/inconclusive/evidence-mismatch-receipt.json
            evidence: evidence/clean/evidence-report.json
            policy: permissive
            expected_decision: inconclusive
            expected_verdict: clean
            expected_outcome: failure
          - name: malformed-optional-evidence-digest
            receipt: evidence/fail/malformed-optional-evidence-digest.json
            policy: permissive
            expected_decision: fail
            expected_verdict: clean
            expected_outcome: failure
          - name: unrequested-unsupported-evidence-digest
            receipt: evidence/clean/unrequested-unsupported-evidence-digest.json
            policy: permissive
            expected_decision: pass
            expected_verdict: clean
            expected_outcome: success

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check out immutable Core action bundle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Xander-Xai/mcp-evidence-gate
          ref: ${{ env.CORE_SHA }}
          path: .core
          fetch-depth: 1

      - name: Assert immutable Core action head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .core rev-parse HEAD)" = "$CORE_SHA"

      - name: Verify ${{ matrix.name }}
        id: evidence
        continue-on-error: true
        env:
          INPUT_RECEIPT: ${{ matrix.receipt }}
          INPUT_ARTIFACT: dist/example-artifact.bin
          INPUT_POLICY: ${{ matrix.policy }}
          INPUT_EVIDENCE: ${{ matrix.evidence }}
        shell: bash
        run: |
          set +e
          node "$GITHUB_WORKSPACE/.core/dist/action/index.cjs"
          code=$?
          set -e
          exit "$code"

      - name: Assert expected decision
        if: always()
        run: |
          echo "decision=${{ steps.evidence.outputs.decision }}"
          echo "receipt-verdict=${{ steps.evidence.outputs.receipt-verdict }}"
          echo "profile=${{ steps.evidence.outputs.profile }}"
          echo "outcome=${{ steps.evidence.outcome }}"
          test "${{ steps.evidence.outputs.decision }}" = "${{ matrix.expected_decision }}"
          test "${{ steps.evidence.outputs.receipt-verdict }}" = "${{ matrix.expected_verdict }}"
          test "${{ steps.evidence.outputs.profile }}" = "registry-pr-1404@20747d3253ba8638161dd95f1cec70df02993c22"
          test "${{ steps.evidence.outcome }}" = "${{ matrix.expected_outcome }}"

  real-trivy-promotion:
    name: real-trivy-promotion
    uses: ./.github/workflows/real-trivy-producer.yml

  real-osv-promotion:
    name: real-osv-promotion
    uses: ./.github/workflows/real-osv-producer.yml

  real-multi-receipt-promotion:
    name: real-multi-receipt-promotion
    uses: ./.github/workflows/real-multi-receipt-composition.yml

  real-oci-identity-promotion:
    name: real-oci-identity-promotion
    uses: ./.github/workflows/real-oci-identity.yml

  scanner-completeness-promotion:
    name: scanner-completeness-promotion
    uses: ./.github/workflows/scanner-completeness-consumer.yml

  producer-snapshot-toctou-promotion:
    name: producer-snapshot-toctou-promotion
    uses: ./.github/workflows/producer-snapshot-toctou-consumer.yml

  remote-action-consumer:
    name: remote Core Action consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Load remote Core Action at exact commit
        id: remote
        continue-on-error: true
        uses: Xander-Xai/mcp-evidence-gate@06567c840c1d68a4b45ff2d12d6e6c32898fff11
        with:
          receipt: evidence/clean/evidence-match-receipt.json
          artifact: dist/example-artifact.bin
          evidence: evidence/clean/evidence-report.json
          policy: permissive

      - name: Check out the same Core commit for bundled comparison
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Xander-Xai/mcp-evidence-gate
          ref: 06567c840c1d68a4b45ff2d12d6e6c32898fff11
          path: .core
          fetch-depth: 1

      - name: Assert immutable bundled comparison head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .core rev-parse HEAD)" = "06567c840c1d68a4b45ff2d12d6e6c32898fff11"

      - name: Run bundled Core Action on the same fixture
        id: bundled
        continue-on-error: true
        env:
          GITHUB_ACTIONS: true
          INPUT_RECEIPT: evidence/clean/evidence-match-receipt.json
          INPUT_ARTIFACT: dist/example-artifact.bin
          INPUT_EVIDENCE: evidence/clean/evidence-report.json
          INPUT_POLICY: permissive
        shell: bash
        run: |
          set +e
          node "$GITHUB_WORKSPACE/.core/dist/action/index.cjs"
          code=$?
          set -e
          exit "$code"

      - name: Assert remote manifest load and all Action outputs
        if: always()
        env:
          REMOTE_OUTCOME: ${{ steps.remote.outcome }}
          BUNDLED_OUTCOME: ${{ steps.bundled.outcome }}
          REMOTE_DECISION: ${{ steps.remote.outputs.decision }}
          BUNDLED_DECISION: ${{ steps.bundled.outputs.decision }}
          REMOTE_RECEIPT_VERDICT: ${{ steps.remote.outputs['receipt-verdict'] }}
          BUNDLED_RECEIPT_VERDICT: ${{ steps.bundled.outputs['receipt-verdict'] }}
          REMOTE_PROFILE: ${{ steps.remote.outputs.profile }}
          BUNDLED_PROFILE: ${{ steps.bundled.outputs.profile }}
          REMOTE_INTEGRITY_STATUS: ${{ steps.remote.outputs['integrity-status'] }}
          BUNDLED_INTEGRITY_STATUS: ${{ steps.bundled.outputs['integrity-status'] }}
          REMOTE_RECEIPT_STATUS: ${{ steps.remote.outputs['receipt-status'] }}
          BUNDLED_RECEIPT_STATUS: ${{ steps.bundled.outputs['receipt-status'] }}
          REMOTE_POLICY_STATUS: ${{ steps.remote.outputs['policy-status'] }}
          BUNDLED_POLICY_STATUS: ${{ steps.bundled.outputs['policy-status'] }}
          REMOTE_ADMISSION_STATUS: ${{ steps.remote.outputs['admission-status'] }}
          BUNDLED_ADMISSION_STATUS: ${{ steps.bundled.outputs['admission-status'] }}
          REMOTE_SCANNER_EXECUTION_STATUS: ${{ steps.remote.outputs['scanner-execution-status'] }}
          BUNDLED_SCANNER_EXECUTION_STATUS: ${{ steps.bundled.outputs['scanner-execution-status'] }}
          REMOTE_REASON_CODES: ${{ steps.remote.outputs['reason-codes'] }}
          BUNDLED_REASON_CODES: ${{ steps.bundled.outputs['reason-codes'] }}
          REMOTE_POLICY_VERSION: ${{ steps.remote.outputs['policy-version'] }}
          BUNDLED_POLICY_VERSION: ${{ steps.bundled.outputs['policy-version'] }}
        shell: bash
        run: |
          set -euo pipefail
          test "$REMOTE_OUTCOME" = success
          test "$BUNDLED_OUTCOME" = success
          for pair in \
            "$REMOTE_DECISION|$BUNDLED_DECISION" \
            "$REMOTE_RECEIPT_VERDICT|$BUNDLED_RECEIPT_VERDICT" \
            "$REMOTE_PROFILE|$BUNDLED_PROFILE" \
            "$REMOTE_INTEGRITY_STATUS|$BUNDLED_INTEGRITY_STATUS" \
            "$REMOTE_RECEIPT_STATUS|$BUNDLED_RECEIPT_STATUS" \
            "$REMOTE_POLICY_STATUS|$BUNDLED_POLICY_STATUS" \
            "$REMOTE_ADMISSION_STATUS|$BUNDLED_ADMISSION_STATUS" \
            "$REMOTE_SCANNER_EXECUTION_STATUS|$BUNDLED_SCANNER_EXECUTION_STATUS" \
            "$REMOTE_REASON_CODES|$BUNDLED_REASON_CODES" \
            "$REMOTE_POLICY_VERSION|$BUNDLED_POLICY_VERSION"; do
            left="${pair%%|*}"
            right="${pair#*|}"
            test "$left" = "$right"
          done
          test "$REMOTE_DECISION" = pass
          test "$REMOTE_RECEIPT_VERDICT" = clean
          test "$REMOTE_PROFILE" = registry-pr-1404@20747d3253ba8638161dd95f1cec70df02993c22
          test "$REMOTE_INTEGRITY_STATUS" = pass
          test "$REMOTE_RECEIPT_STATUS" = valid
          test "$REMOTE_POLICY_STATUS" = pass
          test "$REMOTE_ADMISSION_STATUS" = pass
          test "$REMOTE_SCANNER_EXECUTION_STATUS" = not_evaluated
          test -z "$REMOTE_REASON_CODES"
          test -z "$REMOTE_POLICY_VERSION"
          {
            echo "REMOTE_ACTION_LOAD=PASS"
            echo "REMOTE_ACTION_OUTPUTS=PASS"
            echo "REMOTE_VS_BUNDLED_DECISION=PASS"
            echo "REMOTE_VS_BUNDLED_INTEGRITY=PASS"
            echo "REMOTE_VS_BUNDLED_RECEIPT=PASS"
            echo "REMOTE_VS_BUNDLED_POLICY=PASS"
            echo "REMOTE_VS_BUNDLED_ADMISSION=PASS"
            echo "REMOTE_VS_BUNDLED_SCANNER_EXECUTION=PASS"
            echo "REMOTE_VS_BUNDLED_REASON_CODES=PASS"
          } >> "$GITHUB_STEP_SUMMARY"

  ci-hygiene:
    name: ci-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install structural YAML parser
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2

      - name: Run Dogfood CI hygiene tests
        run: python -m unittest -q tests/test_ci_hygiene.py

      - name: Validate immutable Action pins
        run: python scripts/check_action_pins.py

      - name: Validate promotion gate JSON
        run: >-
          python -c "import json; json.load(open('governance/promotion-gates.json', encoding='utf-8'))"

      - name: Validate consumer composition JSON
        run: >-
          python -c "import json; json.load(open('evidence/consumer-composition-set.json', encoding='utf-8'))"

  promotion-gate:
    name: promotion-gate
    if: always()
    needs:
      - verify-evidence
      - real-trivy-promotion
      - real-osv-promotion
      - real-multi-receipt-promotion
      - real-oci-identity-promotion
      - scanner-completeness-promotion
      - producer-snapshot-toctou-promotion
      - remote-action-consumer
      - ci-hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Require all declared acceptance evidence
        env:
          MATRIX_RESULT: ${{ needs.verify-evidence.result }}
          REAL_TRIVY_RESULT: ${{ needs.real-trivy-promotion.result }}
          REAL_OSV_RESULT: ${{ needs.real-osv-promotion.result }}
          REAL_COMPOSITION_RESULT: ${{ needs.real-multi-receipt-promotion.result }}
          REAL_OCI_IDENTITY_RESULT: ${{ needs.real-oci-identity-promotion.result }}
          SCANNER_COMPLETENESS_RESULT: ${{ needs.scanner-completeness-promotion.result }}
          PRODUCER_SNAPSHOT_RESULT: ${{ needs.producer-snapshot-toctou-promotion.result }}
          REMOTE_ACTION_RESULT: ${{ needs.remote-action-consumer.result }}
          CI_HYGIENE_RESULT: ${{ needs.ci-hygiene.result }}
        run: |
          set -euo pipefail
          echo "deterministic_matrix=$MATRIX_RESULT"
          echo "real_trivy_consumer=$REAL_TRIVY_RESULT"
          echo "real_osv_consumer=$REAL_OSV_RESULT"
          echo "real_multi_receipt_composition=$REAL_COMPOSITION_RESULT"
          echo "real_oci_exact_identity=$REAL_OCI_IDENTITY_RESULT"
          echo "scanner_completeness_consumer=$SCANNER_COMPLETENESS_RESULT"
          echo "producer_artifact_snapshot_external_acceptance=$PRODUCER_SNAPSHOT_RESULT"
          echo "remote_action_consumer=$REMOTE_ACTION_RESULT"
          echo "ci_hygiene=$CI_HYGIENE_RESULT"
          test "$MATRIX_RESULT" = success
          test "$REAL_TRIVY_RESULT" = success
          test "$REAL_OSV_RESULT" = success
          test "$REAL_COMPOSITION_RESULT" = success
          test "$REAL_OCI_IDENTITY_RESULT" = success
          test "$SCANNER_COMPLETENESS_RESULT" = success
          test "$PRODUCER_SNAPSHOT_RESULT" = success
          test "$REMOTE_ACTION_RESULT" = success
          test "$CI_HYGIENE_RESULT" = success

  legacy-required-context-anchor:
    if: always()
    needs:
      - promotion-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: matching-clean
            receipt: evidence/clean/receipt.json
            expected_decision: pass
          - name: digest-mismatch
            receipt: evidence/inconclusive/receipt.json
            expected_decision: inconclusive
          - name: stale
            receipt: evidence/inconclusive/stale.json
            expected_decision: inconclusive
          - name: findings
            receipt: evidence/fail/findings.json
            expected_decision: fail
          - name: malformed-receipt
            receipt: evidence/fail/malformed.json
            expected_decision: fail
    name: verify-evidence (${{ matrix.name }}, ${{ matrix.receipt }}, ${{ matrix.expected_decision }})
    steps:
      - name: Bridge existing branch protection to full promotion gate
        env:
          PROMOTION_GATE_RESULT: ${{ needs.promotion-gate.result }}
        run: |
          set -euo pipefail
          echo "promotion_gate=$PROMOTION_GATE_RESULT"
          test "$PROMOTION_GATE_RESULT" = success
