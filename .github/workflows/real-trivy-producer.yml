name: Real Trivy Producer Consumer

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/real-trivy-producer.yml
      - evidence/real-trivy/requirements.txt

permissions:
  contents: read

jobs:
  real-trivy-producer-consumer:
    runs-on: ubuntu-latest
    env:
      PRODUCER_SHA: 94403156c57059dcce3d224f9b4c321fee32445e
      GATE_SHA: 06567c840c1d68a4b45ff2d12d6e6c32898fff11
      TRIVY_VERSION: 0.74.0
      TRIVY_ARCHIVE_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
      TRIVY_EXECUTABLE_SHA256: d89bcc6510a267f11b773398cbf1be5520ce39f9e8b6633178c4487f05b7d791

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Download and verify pinned Trivy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/trivy.tar.gz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_ARCHIVE_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP"
          echo "${TRIVY_EXECUTABLE_SHA256}  $RUNNER_TEMP/trivy" | sha256sum --check --strict
          test "$("$RUNNER_TEMP/trivy" --version | sed -n 's/^Version: //p')" = "$TRIVY_VERSION"

      - name: Check out immutable producer
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Xander-Xai/mcp-evidence-producer-trivy.git "$RUNNER_TEMP/producer"
          git -C "$RUNNER_TEMP/producer" checkout --detach "$PRODUCER_SHA"
          test "$(git -C "$RUNNER_TEMP/producer" rev-parse HEAD)" = "$PRODUCER_SHA"

      - name: Check out immutable Core action bundle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Xander-Xai/mcp-evidence-gate
          ref: ${{ env.GATE_SHA }}
          path: .core
          fetch-depth: 1

      - name: Assert immutable Core action head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .core rev-parse HEAD)" = "$GATE_SHA"

      - name: Run real producer against consumer-owned artifact
        shell: bash
        run: |
          set -euo pipefail
          python -m src.producer \
            --trivy "$RUNNER_TEMP/trivy" \
            --artifact "$GITHUB_WORKSPACE/evidence/real-trivy/requirements.txt" \
            --out "$RUNNER_TEMP/producer-out"
        working-directory: ${{ runner.temp }}/producer

      - name: Record runtime evidence facts
        id: facts
        shell: bash
        run: |
          set -euo pipefail
          artifact='evidence/real-trivy/requirements.txt'
          out="$RUNNER_TEMP/producer-out"
          artifact_digest="sha256:$(sha256sum "$artifact" | cut -d ' ' -f 1)"
          evidence_digest="sha256:$(sha256sum "$out/evidence.json" | cut -d ' ' -f 1)"
          receipt_digest="sha256:$(sha256sum "$out/receipt.json" | cut -d ' ' -f 1)"
          raw_report_digest="sha256:$(sha256sum "$out/trivy.raw.json" | cut -d ' ' -f 1)"
          receipt_verdict="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["verdict"])' "$out/receipt.json")"
          db_digest="$(python -c 'import json,sys; v=json.load(open(sys.argv[1], encoding="utf-8")).get("scanner_database",{}).get("trivy_db_sha256"); print("sha256:"+v if v and not v.startswith("sha256:") else (v or "UNKNOWN"))' "$out/evidence.json")"
          python - "$artifact_digest" "$evidence_digest" "$receipt_digest" "$raw_report_digest" "$receipt_verdict" "$db_digest" "$out" "$RUNNER_TEMP/runtime-evidence-manifest.json" <<'PY'
          import json
          import os
          import sys

          artifact_digest, evidence_digest, receipt_digest, raw_report_digest, receipt_verdict, db_digest, output_dir, manifest_path = sys.argv[1:]
          receipt = json.load(open(f"{output_dir}/receipt.json", encoding="utf-8"))
          evidence = json.load(open(f"{output_dir}/evidence.json", encoding="utf-8"))
          raw = json.load(open(f"{output_dir}/trivy.raw.json", encoding="utf-8"))

          assert receipt["scanned_artifact_digest"] == artifact_digest
          assert receipt["evidence_digest"] == evidence_digest
          assert receipt["verdict"] == receipt_verdict
          assert receipt_verdict in {"clean", "warnings", "findings", "inconclusive"}
          assert evidence["artifact"]["sha256"] == artifact_digest.removeprefix("sha256:")
          assert evidence["raw_report"]["sha256"] == raw_report_digest.removeprefix("sha256:")
          assert evidence["scanner"]["name"] == "trivy"
          assert evidence["scanner"]["version"] == "0.74.0"
          execution = evidence["scanner_execution"]
          assert execution["schema_version"] == "project-defined-scanner-execution-v1"
          assert execution["completeness_status"] == "complete"
          assert execution["required_work_completed"] is True
          assert execution["result_semantics_consistent"] is True
          assert isinstance(raw, dict)

          manifest = {
              "schema_version": "dogfood-runtime-evidence-v1",
              "dogfood_commit": os.environ["GITHUB_SHA"],
              "producer_commit": os.environ["PRODUCER_SHA"],
              "gate_commit": os.environ["GATE_SHA"],
              "trivy_version": os.environ["TRIVY_VERSION"],
              "trivy_archive_sha256": "sha256:" + os.environ["TRIVY_ARCHIVE_SHA256"],
              "trivy_executable_sha256": "sha256:" + os.environ["TRIVY_EXECUTABLE_SHA256"],
              "artifact_digest": artifact_digest,
              "raw_report_digest": raw_report_digest,
              "evidence_digest": evidence_digest,
              "receipt_digest": receipt_digest,
              "trivy_db_digest": db_digest,
              "receipt_verdict": receipt_verdict,
              "scanner_execution": evidence["scanner_execution"],
              "scanner_database_metadata": evidence.get("scanner_database", {}).get("metadata"),
          }
          with open(manifest_path, "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, sort_keys=True)
              f.write("\n")
          PY
          {
            echo "artifact_digest=$artifact_digest"
            echo "raw_report_digest=$raw_report_digest"
            echo "evidence_digest=$evidence_digest"
            echo "receipt_digest=$receipt_digest"
            echo "db_digest=$db_digest"
            echo "receipt_verdict=$receipt_verdict"
          } >> "$GITHUB_OUTPUT"

      - name: Verify real evidence with immutable gate
        id: gate
        continue-on-error: true
        env:
          INPUT_RECEIPT: ${{ runner.temp }}/producer-out/receipt.json
          INPUT_ARTIFACT: evidence/real-trivy/requirements.txt
          INPUT_EVIDENCE: ${{ runner.temp }}/producer-out/evidence.json
          INPUT_POLICY: permissive
        shell: bash
        run: |
          set +e
          node "$GITHUB_WORKSPACE/.core/dist/action/index.cjs"
          code=$?
          set -e
          exit "$code"

      - name: Assert dynamic gate decision and Action outcome
        if: always()
        env:
          ACTUAL_DECISION: ${{ steps.gate.outputs.decision }}
          ACTUAL_VERDICT: ${{ steps.gate.outputs.receipt-verdict }}
          ACTUAL_OUTCOME: ${{ steps.gate.outcome }}
          PRODUCER_VERDICT: ${{ steps.facts.outputs.receipt_verdict }}
        shell: bash
        run: |
          set -euo pipefail
          case "$PRODUCER_VERDICT" in
            clean) expected_decision=pass ;;
            warnings) expected_decision=warn ;;
            findings) expected_decision=fail ;;
            inconclusive) expected_decision=inconclusive ;;
            *) echo "unsupported producer verdict: $PRODUCER_VERDICT" >&2; exit 1 ;;
          esac
          case "$expected_decision" in
            pass|warn) expected_outcome=success ;;
            fail|inconclusive) expected_outcome=failure ;;
          esac
          test "$ACTUAL_VERDICT" = "$PRODUCER_VERDICT"
          test "$ACTUAL_DECISION" = "$expected_decision"
          test "$ACTUAL_OUTCOME" = "$expected_outcome"
          python - "$RUNNER_TEMP/runtime-evidence-manifest.json" "$ACTUAL_DECISION" "$ACTUAL_OUTCOME" <<'PY'
          import json
          import sys
          path, decision, outcome = sys.argv[1:]
          data = json.load(open(path, encoding="utf-8"))
          data["gate_decision"] = decision
          data["gate_step_outcome"] = outcome
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, sort_keys=True)
              f.write("\n")
          PY
          {
            echo "## Real Trivy producer-consumer evidence"
            echo
            echo "| Field | Runtime value |"
            echo "| --- | --- |"
            echo "| Producer commit | \`$PRODUCER_SHA\` |"
            echo "| Gate commit | \`$GATE_SHA\` |"
            echo "| Trivy | \`$TRIVY_VERSION\` |"
            echo "| Artifact digest | \`${{ steps.facts.outputs.artifact_digest }}\` |"
            echo "| Raw report digest | \`${{ steps.facts.outputs.raw_report_digest }}\` |"
            echo "| Evidence digest | \`${{ steps.facts.outputs.evidence_digest }}\` |"
            echo "| Receipt digest | \`${{ steps.facts.outputs.receipt_digest }}\` |"
            echo "| Trivy DB digest | \`${{ steps.facts.outputs.db_digest }}\` |"
            echo "| Receipt verdict | \`$PRODUCER_VERDICT\` |"
            echo "| Scanner execution | \`complete\` |"
            echo "| Gate decision | \`$ACTUAL_DECISION\` |"
            echo "| Gate step outcome | \`$ACTUAL_OUTCOME\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload runtime evidence bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-trivy-runtime-evidence-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/runtime-evidence-manifest.json
            ${{ runner.temp }}/producer-out/receipt.json
            ${{ runner.temp }}/producer-out/evidence.json
            ${{ runner.temp }}/producer-out/trivy.raw.json
            ${{ runner.temp }}/producer-out/trivy.stderr.log
