name: Core SBOM second artifact generalization

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CORE_SHA: 7c6d7089d25a24ead7a42a3a96319fff2bbeac0a
  SYFT_VERSION: 1.52.0
  SYFT_TAR_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
  SECOND_REF: ghcr.io/github/github-mcp-server@sha256:a44e77b9c9003ed0e228716d118aa4ce9f3418dce30fe2340c71553164bd96f0
  SECOND_DIGEST: sha256:a44e77b9c9003ed0e228716d118aa4ce9f3418dce30fe2340c71553164bd96f0
  SECOND_REPO: github/github-mcp-server
  OTHER_REF: ghcr.io/ibm/mcp-context-forge@sha256:dd0998be722d180f429030cf2cd74357498b3e4daf887305ee9b8003526f83f0
  OTHER_DIGEST: sha256:dd0998be722d180f429030cf2cd74357498b3e4daf887305ee9b8003526f83f0

jobs:
  second-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 24}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with: {version: 10.33.4}
      - name: Fetch promoted Core, Syft, and immutable OCI manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/syft" "$RUNNER_TEMP/oci"
          curl -fsSL "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz" -o "$RUNNER_TEMP/syft/syft.tar.gz"
          echo "${SYFT_TAR_SHA256}  $RUNNER_TEMP/syft/syft.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/syft/syft.tar.gz" -C "$RUNNER_TEMP/syft"
          curl -fsSL -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' "https://ghcr.io/v2/${SECOND_REPO}/manifests/${SECOND_DIGEST}" -o "$RUNNER_TEMP/oci/second.json"
          curl -fsSL -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' "https://ghcr.io/v2/ibm/mcp-context-forge/manifests/${OTHER_DIGEST}" -o "$RUNNER_TEMP/oci/other.json"
          test "sha256:$(sha256sum "$RUNNER_TEMP/oci/second.json" | cut -d' ' -f1)" = "$SECOND_DIGEST"
          test "sha256:$(sha256sum "$RUNNER_TEMP/oci/other.json" | cut -d' ' -f1)" = "$OTHER_DIGEST"
          git clone https://github.com/Xander-Xai/mcp-evidence-gate.git "$RUNNER_TEMP/core"
          git -C "$RUNNER_TEMP/core" checkout --detach "$CORE_SHA"
          pnpm --dir "$RUNNER_TEMP/core" install --frozen-lockfile
          pnpm --dir "$RUNNER_TEMP/core" build
      - name: Generate local Syft SBOM and verify generalization cases
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/syft/syft" "$SECOND_REF" -o "syft-json=$RUNNER_TEMP/oci/second.sbom.json"
          "$RUNNER_TEMP/syft/syft" "$SECOND_REF" -o "syft-json=$RUNNER_TEMP/oci/second.repeat.sbom.json"
          node --input-type=module - "$RUNNER_TEMP/core" "$RUNNER_TEMP/oci" "$RUNNER_TEMP/result.json" <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { join } from 'node:path';
          const core=process.argv[2], root=process.argv[3], output=process.argv[4];
          const { verifySbomEvidence } = await import(core + '/dist/core/sbom.js');
          const digest=b=>`sha256:${createHash('sha256').update(b).digest('hex')}`;
          const artifactPath=join(root,'second.json'), otherPath=join(root,'other.json');
          const artifact=await readFile(artifactPath), other=await readFile(otherPath), sbom=await readFile(join(root,'second.sbom.json')), repeat=await readFile(join(root,'second.repeat.sbom.json'));
          const artifactDigest=digest(artifact), otherDigest=digest(other), sbomDigest=digest(sbom), doc=JSON.parse(sbom.toString()), repeatDoc=JSON.parse(repeat.toString());
          if (artifactDigest!==process.env.SECOND_DIGEST || otherDigest!==process.env.OTHER_DIGEST) throw new Error('manifest_digest_verification_failed');
          if (doc.schema?.version!=='16.1.3' || !doc.source?.version || doc.source.version!==process.env.SECOND_DIGEST) throw new Error(JSON.stringify({error:'exact_source_binding_not_proven',source:doc.source,schema:doc.schema}));
          const envelope=(bytes=sbom, artifactSha=artifactDigest)=>({schema_version:'project-defined-sbom-evidence-v1',artifact:{ref:process.env.SECOND_REF,sha256:artifactSha,size:artifactSha===artifactDigest?artifact.length:other.length},sbom:{format:'syft-json',schema_version:'16.1.3',sha256:digest(bytes),size:bytes.length},relationship:{type:'generated-from',artifact_sha256:artifactDigest,sbom_sha256:digest(bytes),binding:'exact-artifact'},inventory:{status:'present',package_count:doc.artifacts.length}});
          const a=await verifySbomEvidence(artifactPath,envelope(),sbom);
          const tampered=Buffer.concat([sbom,Buffer.from('\n')]);
          const b=await verifySbomEvidence(artifactPath,envelope(),tampered);
          const cEnvelope=envelope(); cEnvelope.artifact.sha256=otherDigest; cEnvelope.artifact.size=other.length; cEnvelope.relationship.artifact_sha256=artifactDigest;
          const c=await verifySbomEvidence(otherPath,cEnvelope,sbom);
          const semantic=x=>JSON.stringify({schema:x.schema?.version,source:x.source?.version,artifacts:(x.artifacts||[]).map(p=>({id:p.id,name:p.name,version:p.version,type:p.type})).sort((x,y)=>x.id.localeCompare(y.id))});
          const byteReproducible=digest(sbom)===digest(repeat), semanticStable=semantic(doc)===semantic(repeatDoc);
          if(a.status!=='pass'||b.status!=='blocked'||!b.reasonCodes.includes('sbom_digest_mismatch')||c.status!=='blocked'||!c.reasonCodes.includes('artifact_sbom_binding_mismatch')||!semanticStable) throw new Error(JSON.stringify({a,b,c,byteReproducible,semanticStable,source:doc.source}));
          await writeFile(output,JSON.stringify({core_sha:process.env.CORE_SHA,artifact_ref:process.env.SECOND_REF,artifact_digest:artifactDigest,sbom_digest:sbomDigest,schema:doc.schema.version,package_count:doc.artifacts.length,source:doc.source,cases:{A2:a,B2:b,C2:c,D2:{byte_reproducible:byteReproducible,semantic_identity_stable:semanticStable}},classification:'GENERALIZED'},null,2));
          JS
      - name: Upload second-artifact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-sbom-second-artifact-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/result.json
