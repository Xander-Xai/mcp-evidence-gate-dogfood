name: Package archive producer acceptance
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  package-archive:
    runs-on: ubuntu-latest
    env:
      PRODUCER_SHA: 2aeeb6c
      CORE_RUNTIME_SHA: 54bc7511bc42e553e47f2903668bc22a886d1c30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 24}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Create deterministic npm package and exact snapshot
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fixture"
          cat > "$RUNNER_TEMP/fixture/package.json" <<'JSON'
          {"name":"mcp-evidence-fixture","version":"1.0.0","private":true}
          JSON
          cat > "$RUNNER_TEMP/fixture/package-lock.json" <<'JSON'
          {"name":"mcp-evidence-fixture","version":"1.0.0","lockfileVersion":3,"requires":true,"packages":{"":{"name":"mcp-evidence-fixture","version":"1.0.0"}}}
          JSON
          npm pack "$RUNNER_TEMP/fixture" --silent --pack-destination "$RUNNER_TEMP"
          artifact="$RUNNER_TEMP/mcp-evidence-fixture-1.0.0.tgz"
          test -f "$artifact"; echo "artifact=$artifact" >> "$GITHUB_OUTPUT"; sha256sum "$artifact" | tee "$RUNNER_TEMP/artifact.sha256"
      - name: Download pinned Trivy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/trivy.tar.gz" https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          echo '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  '"$RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP"
          echo 'd89bcc6510a267f11b773398cbf1be5520ce39f9e8b6633178c4487f05b7d791  '"$RUNNER_TEMP/trivy" | sha256sum --check --strict
      - name: Run Producer archive adapter
        id: producer
        shell: bash
        run: |
          set -u
          git clone https://github.com/Xander-Xai/mcp-evidence-producer-trivy.git "$RUNNER_TEMP/producer"
          git -C "$RUNNER_TEMP/producer" checkout --detach "$PRODUCER_SHA"
          python -m venv "$RUNNER_TEMP/venv"; source "$RUNNER_TEMP/venv/bin/activate"; pip install -q -e "$RUNNER_TEMP/producer"
          cd "$RUNNER_TEMP/producer"; set +e
          python -m src.producer --trivy "$RUNNER_TEMP/trivy" --artifact "${{ steps.pack.outputs.artifact }}" --out "$RUNNER_TEMP/out"
          code=$?; set -e; echo "exit=$code" >> "$GITHUB_OUTPUT"
      - name: Verify exact archive with Core
        id: gate
        continue-on-error: true
        uses: Xander-Xai/mcp-evidence-gate@54bc7511bc42e553e47f2903668bc22a886d1c30
        with:
          receipt: ${{ runner.temp }}/out/receipt.json
          artifact: ${{ steps.pack.outputs.artifact }}
          evidence: ${{ runner.temp }}/out/evidence.json
          policy: strict-scanner-completeness
      - name: Tamper original archive and verify binding
        id: negative
        shell: bash
        run: |
          cp "${{ steps.pack.outputs.artifact }}" "$RUNNER_TEMP/tampered.tgz"; printf '\n' >> "$RUNNER_TEMP/tampered.tgz"
          echo "tampered=$RUNNER_TEMP/tampered.tgz" >> "$GITHUB_OUTPUT"
      - name: Verify tampered archive is blocked
        id: tampered_gate
        continue-on-error: true
        uses: Xander-Xai/mcp-evidence-gate@54bc7511bc42e553e47f2903668bc22a886d1c30
        with:
          receipt: ${{ runner.temp }}/out/receipt.json
          artifact: ${{ runner.temp }}/tampered.tgz
          evidence: ${{ runner.temp }}/out/evidence.json
          policy: strict-scanner-completeness
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: package-archive-acceptance-${{ github.sha }}
          path: |
            ${{ runner.temp }}/artifact.sha256
            ${{ runner.temp }}/out
          retention-days: 90
          if-no-files-found: warn
      - name: Summary
        if: always()
        run: |
          echo "Producer=$PRODUCER_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Gate=${{ steps.gate.outcome }} / ${{ steps.gate.outputs.decision }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Tampered=${{ steps.tampered_gate.outcome }} / ${{ steps.tampered_gate.outputs.decision }}" >> "$GITHUB_STEP_SUMMARY"
