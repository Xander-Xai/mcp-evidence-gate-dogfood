name: Real Multi-Receipt Composition

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/real-multi-receipt-composition.yml
      - evidence/real-trivy/requirements.txt

permissions:
  contents: read

jobs:
  real-multi-receipt-composition:
    runs-on: ubuntu-latest
    env:
      PRODUCER_REVIEWED_SHA: 94403156c57059dcce3d224f9b4c321fee32445e
      PRODUCER_BASELINE_MAIN_SHA: 4c4d9bd476396cd7e34e9d4182900ac00b03d17b
      CORE_REVIEWED_SHA: 8c6d19b9ad90d6f066fa6fd1f41d0a8da3b017f3
      CORE_CANDIDATE_SHA: 8c6d19b9ad90d6f066fa6fd1f41d0a8da3b017f3
      TRIVY_VERSION: 0.74.0
      TRIVY_ARCHIVE_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
      TRIVY_EXECUTABLE_SHA256: d89bcc6510a267f11b773398cbf1be5520ce39f9e8b6633178c4487f05b7d791
      OSV_VERSION: 2.5.1
      OSV_EXECUTABLE_SHA256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.33.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Download and verify pinned scanners
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_ARCHIVE_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP"
          echo "${TRIVY_EXECUTABLE_SHA256}  $RUNNER_TEMP/trivy" | sha256sum --check --strict
          test "$("$RUNNER_TEMP/trivy" --version | sed -n 's/^Version: //p')" = "$TRIVY_VERSION"

          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_EXECUTABLE_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"
          actual_osv_version="$("$RUNNER_TEMP/osv-scanner" --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          test "$actual_osv_version" = "$OSV_VERSION"

      - name: Check out immutable reviewed producer
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Xander-Xai/mcp-evidence-producer-trivy.git "$RUNNER_TEMP/producer"
          git -C "$RUNNER_TEMP/producer" checkout --detach "$PRODUCER_REVIEWED_SHA"
          test "$(git -C "$RUNNER_TEMP/producer" rev-parse HEAD)" = "$PRODUCER_REVIEWED_SHA"

      - name: Produce independent Trivy and OSV receipts for one consumer artifact
        shell: bash
        working-directory: ${{ runner.temp }}/producer
        run: |
          set -euo pipefail
          artifact="$GITHUB_WORKSPACE/evidence/real-trivy/requirements.txt"
          python -m src.producer \
            --trivy "$RUNNER_TEMP/trivy" \
            --artifact "$artifact" \
            --out "$RUNNER_TEMP/trivy-out"
          python -m src.osv_producer \
            --osv "$RUNNER_TEMP/osv-scanner" \
            --artifact "$artifact" \
            --out "$RUNNER_TEMP/osv-out"

      - name: Check out and build immutable composed consumer
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Xander-Xai/mcp-evidence-gate.git "$RUNNER_TEMP/core"
          git -C "$RUNNER_TEMP/core" checkout --detach "$CORE_CANDIDATE_SHA"
          test "$(git -C "$RUNNER_TEMP/core" rev-parse HEAD)" = "$CORE_CANDIDATE_SHA"
          pnpm --dir "$RUNNER_TEMP/core" install --frozen-lockfile
          pnpm --dir "$RUNNER_TEMP/core" build

      - name: Verify singles, compose the set, and independently assert semantics
        id: composition
        shell: bash
        run: |
          set -euo pipefail
          echo "runtime_started=true" >> "$GITHUB_OUTPUT"
          artifact="$GITHUB_WORKSPACE/evidence/real-trivy/requirements.txt"
          core="$RUNNER_TEMP/core/dist/cli.js"
          evaluated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          cat > "$RUNNER_TEMP/receipt-set.json" <<'JSON'
          {
            "schema_version": "project-defined-receipt-set-v1",
            "receipts": [
              {"id":"trivy","receipt":"trivy-out/receipt.json","evidence":"trivy-out/evidence.json"},
              {"id":"osv","receipt":"osv-out/receipt.json","evidence":"osv-out/evidence.json"}
            ]
          }
          JSON

          set +e
          node "$core" verify \
            --receipt "$RUNNER_TEMP/trivy-out/receipt.json" \
            --artifact "$artifact" \
            --evidence "$RUNNER_TEMP/trivy-out/evidence.json" \
            --policy permissive --format json --now "$evaluated_at" \
            > "$RUNNER_TEMP/trivy-single.json"
          trivy_code=$?
          node "$core" verify \
            --receipt "$RUNNER_TEMP/osv-out/receipt.json" \
            --artifact "$artifact" \
            --evidence "$RUNNER_TEMP/osv-out/evidence.json" \
            --policy permissive --format json --now "$evaluated_at" \
            > "$RUNNER_TEMP/osv-single.json"
          osv_code=$?
          node "$core" verify-set \
            --set "$RUNNER_TEMP/receipt-set.json" \
            --artifact "$artifact" \
            --policy permissive --format json --now "$evaluated_at" \
            > "$RUNNER_TEMP/composition.json"
          composition_code=$?
          set -e

          test "$trivy_code" -ne 3
          test "$osv_code" -ne 3
          test "$composition_code" -ne 3

          python - \
            "$artifact" \
            "$RUNNER_TEMP/trivy-out" \
            "$RUNNER_TEMP/osv-out" \
            "$RUNNER_TEMP/trivy-single.json" \
            "$RUNNER_TEMP/osv-single.json" \
            "$RUNNER_TEMP/receipt-set.json" \
            "$RUNNER_TEMP/composition.json" \
            "$RUNNER_TEMP/runtime-evidence-manifest.json" \
            "$trivy_code" "$osv_code" "$composition_code" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          (artifact_path, trivy_out, osv_out, trivy_single_path, osv_single_path,
           set_path, composition_path, manifest_path, trivy_code, osv_code,
           composition_code) = sys.argv[1:]

          artifact = Path(artifact_path).resolve()
          trivy_out = Path(trivy_out)
          osv_out = Path(osv_out)

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          def digest(path):
              return "sha256:" + sha(path)

          def load(path):
              with open(path, encoding="utf-8") as handle:
                  return json.load(handle)

          def parse_time(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00")).astimezone(timezone.utc)

          artifact_digest = digest(artifact)
          trivy_receipt = load(trivy_out / "receipt.json")
          trivy_evidence = load(trivy_out / "evidence.json")
          osv_receipt = load(osv_out / "receipt.json")
          osv_evidence = load(osv_out / "evidence.json")
          trivy_single = load(trivy_single_path)
          osv_single = load(osv_single_path)
          receipt_set = load(set_path)
          composition = load(composition_path)

          assert receipt_set["schema_version"] == "project-defined-receipt-set-v1"
          assert [entry["id"] for entry in receipt_set["receipts"]] == ["trivy", "osv"]

          for receipt, evidence, scanner, version in (
              (trivy_receipt, trivy_evidence, "trivy", os.environ["TRIVY_VERSION"]),
              (osv_receipt, osv_evidence, "osv-scanner", os.environ["OSV_VERSION"]),
          ):
              assert receipt["scanner"] == scanner
              assert receipt["scanner_version"] == version
              assert Path(receipt["scanned_artifact_ref"]).resolve() == artifact
              assert receipt["scanned_artifact_digest"] == artifact_digest
              assert Path(evidence["artifact"]["ref"]).resolve() == artifact
              assert evidence["artifact"]["sha256"] == artifact_digest.removeprefix("sha256:")
              execution = evidence["scanner_execution"]
              assert execution["schema_version"] == "project-defined-scanner-execution-v1"
              assert execution["completeness_status"] == "complete"
              assert execution["required_work_completed"] is True
              assert execution["result_semantics_consistent"] is True

          trivy_evidence_digest = digest(trivy_out / "evidence.json")
          osv_evidence_digest = digest(osv_out / "evidence.json")
          assert trivy_receipt["evidence_digest"] == trivy_evidence_digest
          assert osv_receipt["evidence_digest"] == osv_evidence_digest

          profile = "registry-pr-1404@20747d3253ba8638161dd95f1cec70df02993c22"
          assert trivy_single["profile"] == profile
          assert osv_single["profile"] == profile
          assert composition["profile"] == profile
          assert composition["mode"] == "receipt-set"
          assert composition["policy"] == "permissive"
          assert composition["receiptCount"] == 2
          assert composition["artifactDigest"] == artifact_digest
          assert composition["evaluatedAt"] == trivy_single["evaluatedAt"] == osv_single["evaluatedAt"]
          evaluated_at = parse_time(composition["evaluatedAt"])
          assert evaluated_at >= parse_time(trivy_receipt["scanned_at"])
          assert evaluated_at >= parse_time(osv_receipt["scanned_at"])
          assert all(check.get("reason") != "scan_timestamp_in_future" for check in trivy_single["checks"])
          assert all(check.get("reason") != "scan_timestamp_in_future" for check in osv_single["checks"])

          by_id = {entry["id"]: entry for entry in composition["receipts"]}
          assert set(by_id) == {"trivy", "osv"}
          assert by_id["trivy"]["scanner"] == "trivy"
          assert by_id["osv"]["scanner"] == "osv-scanner"
          assert by_id["trivy"]["decision"] == trivy_single["decision"]
          assert by_id["osv"]["decision"] == osv_single["decision"]
          assert by_id["trivy"]["receiptVerdict"] == trivy_single["receiptVerdict"] == trivy_receipt["verdict"]
          assert by_id["osv"]["receiptVerdict"] == osv_single["receiptVerdict"] == osv_receipt["verdict"]
          assert by_id["trivy"]["checks"]
          assert by_id["osv"]["checks"]

          rank = {"pass": 0, "warn": 1, "inconclusive": 2, "fail": 3}
          expected = max((trivy_single["decision"], osv_single["decision"]), key=rank.__getitem__)
          assert composition["decision"] == expected
          exit_for = {"pass": 0, "warn": 0, "fail": 1, "inconclusive": 2}
          assert int(trivy_code) == exit_for[trivy_single["decision"]]
          assert int(osv_code) == exit_for[osv_single["decision"]]
          assert int(composition_code) == exit_for[composition["decision"]]

          osv_raw = load(osv_out / "osv.raw.json")
          osv_sources = [row.get("source", {}) for row in osv_raw.get("results", [])]
          assert osv_sources
          osv_snapshot_target = Path(osv_evidence["invocation"]["argv"][-1]).resolve()
          assert osv_snapshot_target != artifact
          assert all(Path(source["path"]).resolve() == osv_snapshot_target for source in osv_sources)
          source_types = {source.get("type") for source in osv_sources}
          assert source_types <= {"lockfile", "unknown"}
          assert "lockfile" in source_types
          assert osv_evidence["scanner_database"]["snapshot"] == "unavailable"

          manifest = {
              "schema_version": "dogfood-multi-receipt-runtime-evidence-v1",
              "dogfood_commit": os.environ["GITHUB_SHA"],
              "producer_reviewed_commit": os.environ["PRODUCER_REVIEWED_SHA"],
              "producer_baseline_main_commit": os.environ["PRODUCER_BASELINE_MAIN_SHA"],
              "core_reviewed_commit": os.environ["CORE_REVIEWED_SHA"],
              "core_candidate_commit": os.environ["CORE_CANDIDATE_SHA"],
              "profile": profile,
              "policy": composition["policy"],
              "evaluated_at": composition["evaluatedAt"],
              "artifact_digest": artifact_digest,
              "trivy": {
                  "version": os.environ["TRIVY_VERSION"],
                  "archive_sha256": "sha256:" + os.environ["TRIVY_ARCHIVE_SHA256"],
                  "executable_sha256": "sha256:" + os.environ["TRIVY_EXECUTABLE_SHA256"],
                  "receipt_digest": digest(trivy_out / "receipt.json"),
                  "evidence_digest": trivy_evidence_digest,
                  "raw_report_digest": digest(trivy_out / "trivy.raw.json"),
                  "receipt_verdict": trivy_receipt["verdict"],
                  "single_decision": trivy_single["decision"],
                  "single_exit_code": int(trivy_code),
                  "scanner_execution": trivy_evidence["scanner_execution"],
              },
              "osv": {
                  "version": os.environ["OSV_VERSION"],
                  "executable_sha256": "sha256:" + os.environ["OSV_EXECUTABLE_SHA256"],
                  "receipt_digest": digest(osv_out / "receipt.json"),
                  "evidence_digest": osv_evidence_digest,
                  "raw_report_digest": digest(osv_out / "osv.raw.json"),
                  "receipt_verdict": osv_receipt["verdict"],
                  "single_decision": osv_single["decision"],
                  "single_exit_code": int(osv_code),
                  "source_types": sorted(source_types),
                  "scanner_execution": osv_evidence["scanner_execution"],
                  "scanner_database": osv_evidence["scanner_database"],
              },
              "receipt_set_digest": digest(set_path),
              "composition_result_digest": digest(composition_path),
              "aggregate_decision": composition["decision"],
              "composition_exit_code": int(composition_code),
          }
          with open(manifest_path, "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

          aggregate_decision="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["decision"])' "$RUNNER_TEMP/composition.json")"
          artifact_digest="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["artifactDigest"])' "$RUNNER_TEMP/composition.json")"
          trivy_decision="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["decision"])' "$RUNNER_TEMP/trivy-single.json")"
          osv_decision="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["decision"])' "$RUNNER_TEMP/osv-single.json")"
          {
            echo "aggregate_decision=$aggregate_decision"
            echo "artifact_digest=$artifact_digest"
            echo "trivy_decision=$trivy_decision"
            echo "osv_decision=$osv_decision"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Real multi-receipt composition evidence"
            echo
            echo "| Field | Runtime value |"
            echo "| --- | --- |"
            echo "| Producer reviewed commit | \`$PRODUCER_REVIEWED_SHA\` |"
            echo "| Producer baseline main | \`$PRODUCER_BASELINE_MAIN_SHA\` |"
            echo "| Core reviewed commit | \`$CORE_REVIEWED_SHA\` |"
            echo "| Core candidate commit | \`$CORE_CANDIDATE_SHA\` |"
            echo "| Artifact digest | \`$artifact_digest\` |"
            echo "| Trivy decision | \`$trivy_decision\` |"
            echo "| OSV decision | \`$osv_decision\` |"
            echo "| Aggregate decision | \`$aggregate_decision\` |"
            echo "| Composition exit | \`$composition_code\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reject strict composition with one incomplete receipt
        id: strict_composition
        shell: bash
        run: |
          set -euo pipefail
          artifact="$GITHUB_WORKSPACE/evidence/real-trivy/requirements.txt"
          core="$RUNNER_TEMP/core/dist/cli.js"
          cp -a "$RUNNER_TEMP/trivy-out" "$RUNNER_TEMP/strict-trivy-out"
          python - "$RUNNER_TEMP/strict-trivy-out" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])
          evidence_path = output / "evidence.json"
          evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
          execution = evidence["scanner_execution"]
          execution.update({
              "completeness_status": "incomplete",
              "required_work_completed": False,
              "result_semantics_consistent": False,
              "completed_components": [],
              "failed_components": ["result_sections"],
              "completeness_reason": "trivy_result_sections_missing",
          })
          evidence_path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          receipt_path = output / "receipt.json"
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          evidence_digest = "sha256:" + hashlib.sha256(evidence_path.read_bytes()).hexdigest()
          receipt["evidence_digest"] = evidence_digest
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          cat > "$RUNNER_TEMP/strict-receipt-set.json" <<'JSON'
          {
            "schema_version": "project-defined-receipt-set-v1",
            "receipts": [
              {"id":"trivy-incomplete","receipt":"strict-trivy-out/receipt.json","evidence":"strict-trivy-out/evidence.json"},
              {"id":"osv-complete","receipt":"osv-out/receipt.json","evidence":"osv-out/evidence.json"}
            ]
          }
          JSON

          evaluated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          node "$core" verify-set \
            --set "$RUNNER_TEMP/strict-receipt-set.json" \
            --artifact "$artifact" \
            --policy strict-scanner-completeness --format json --now "$evaluated_at" \
            > "$RUNNER_TEMP/strict-composition.json"
          strict_code=$?
          set -e
          test "$strict_code" -eq 1

          python - "$RUNNER_TEMP/strict-receipt-set.json" "$RUNNER_TEMP/strict-composition.json" "$RUNNER_TEMP/strict-composition-manifest.json" "$strict_code" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          set_path, composition_path, manifest_path, strict_code = sys.argv[1:]
          receipt_set = json.loads(Path(set_path).read_text(encoding="utf-8"))
          composition = json.loads(Path(composition_path).read_text(encoding="utf-8"))
          entries = {entry["id"]: entry for entry in composition["receipts"]}

          assert composition["policy"] == "strict-scanner-completeness"
          assert composition["decision"] == "fail"
          assert composition["integrity_status"] == "pass"
          assert composition["receipt_status"] == "valid"
          assert composition["admission_status"] == "fail"
          assert "scanner_execution_incomplete" in composition["reason_codes"]
          assert entries["trivy-incomplete"]["scannerExecutionStatus"] == "incomplete"
          assert entries["trivy-incomplete"]["decision"] == "fail"
          assert entries["trivy-incomplete"]["integrityStatus"] == "pass"
          assert entries["osv-complete"]["scannerExecutionStatus"] == "complete"
          assert int(strict_code) == 1

          manifest = {
              "schema_version": "dogfood-strict-multi-receipt-runtime-evidence-v1",
              "dogfood_commit": os.environ["GITHUB_SHA"],
              "producer_reviewed_commit": os.environ["PRODUCER_REVIEWED_SHA"],
              "core_commit": os.environ["CORE_CANDIDATE_SHA"],
              "receipt_set": receipt_set,
              "composition": composition,
              "strict_exit_code": int(strict_code),
              "incomplete_receipt_cannot_be_hidden": True,
          }
          Path(manifest_path).write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          echo "strict_code=$strict_code" >> "$GITHUB_OUTPUT"
          {
            echo "## Strict multi-receipt completeness rejection"
            echo
            echo "One digest-bound but incomplete Trivy receipt was composed with one complete OSV receipt."
            echo "The strict-scanner-completeness aggregate decision is \`fail\` (exit \`$strict_code\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload multi-receipt runtime evidence bundle
        if: always() && steps.composition.outputs.runtime_started == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-multi-receipt-runtime-evidence-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/runtime-evidence-manifest.json
            ${{ runner.temp }}/receipt-set.json
            ${{ runner.temp }}/composition.json
            ${{ runner.temp }}/trivy-single.json
            ${{ runner.temp }}/osv-single.json
            ${{ runner.temp }}/trivy-out/receipt.json
            ${{ runner.temp }}/trivy-out/evidence.json
            ${{ runner.temp }}/trivy-out/trivy.raw.json
            ${{ runner.temp }}/trivy-out/trivy.stderr.log
            ${{ runner.temp }}/osv-out/receipt.json
            ${{ runner.temp }}/osv-out/evidence.json
            ${{ runner.temp }}/osv-out/osv.raw.json
            ${{ runner.temp }}/osv-out/osv.stderr.log
            ${{ runner.temp }}/strict-receipt-set.json
            ${{ runner.temp }}/strict-composition.json
            ${{ runner.temp }}/strict-composition-manifest.json
            ${{ runner.temp }}/strict-trivy-out/receipt.json
            ${{ runner.temp }}/strict-trivy-out/evidence.json
            ${{ runner.temp }}/strict-trivy-out/trivy.raw.json
            ${{ runner.temp }}/strict-trivy-out/trivy.stderr.log
