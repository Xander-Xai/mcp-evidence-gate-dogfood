name: Package archive coverage dogfood

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/package-archive-coverage-dogfood.yml]

permissions:
  contents: read

env:
  PRODUCER_SHA: 0c18587
  CORE_SHA: da0b697da6b55d14db13fafec7538c83a314b035
  TRIVY_VERSION: 0.74.0
  TRIVY_ARCHIVE_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
  TRIVY_EXECUTABLE_SHA256: d89bcc6510a267f11b773398cbf1be5520ce39f9e8b6633178c4487f05b7d791

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11'}
      - name: Fetch pinned scanner and immutable producer
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/trivy.tgz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "$TRIVY_ARCHIVE_SHA256  $RUNNER_TEMP/trivy.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP"
          echo "$TRIVY_EXECUTABLE_SHA256  $RUNNER_TEMP/trivy" | sha256sum --check --strict
          git clone https://github.com/Xander-Xai/mcp-evidence-producer-trivy.git "$RUNNER_TEMP/producer"
          git -C "$RUNNER_TEMP/producer" checkout --detach "$PRODUCER_SHA"
          test "$(git -C "$RUNNER_TEMP/producer" rev-parse HEAD)" = "$(git -C "$RUNNER_TEMP/producer" rev-parse "$PRODUCER_SHA")"
      - name: Run classes A no-targets, B supported-target-no-results, C tamper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fixtures/package"
          printf '{"name":"fixture","version":"1.0.0"}\n' > "$RUNNER_TEMP/fixtures/package/package.json"
          tar -czf "$RUNNER_TEMP/class-a.tgz" -C "$RUNNER_TEMP/fixtures" package
          printf '{"name":"fixture","version":"1.0.0","lockfileVersion":3,"packages":{}}\n' > "$RUNNER_TEMP/fixtures/package/package-lock.json"
          tar -czf "$RUNNER_TEMP/class-b.tgz" -C "$RUNNER_TEMP/fixtures" package
          for cls in a b; do
            mkdir -p "$RUNNER_TEMP/out-$cls"
            set +e
            (cd "$RUNNER_TEMP/producer" && python -m src.producer --trivy "$RUNNER_TEMP/trivy" --artifact "$RUNNER_TEMP/class-$cls.tgz" --out "$RUNNER_TEMP/out-$cls")
            code=$?
            set -e
            test "$code" = 1
          done
          python - "$RUNNER_TEMP/out-a/evidence.json" "$RUNNER_TEMP/out-b/evidence.json" <<'PY'
          import json, sys
          a=json.load(open(sys.argv[1])); b=json.load(open(sys.argv[2]))
          assert a['scan_coverage']['status']=='no_supported_targets'
          assert a['scanner_execution']['completeness_status']=='complete'
          assert b['scan_coverage']['status']=='targets_present'
          assert b['scanner_execution']['completeness_status']=='incomplete'
          assert b['scanner_execution']['completeness_reason']=='supported_target_result_missing'
          PY
          cp "$RUNNER_TEMP/out-a/evidence.json" "$RUNNER_TEMP/tampered.json"
          python - "$RUNNER_TEMP/tampered.json" <<'PY'
          import json,sys
          p=sys.argv[1]; x=json.load(open(p)); x['scan_coverage']['status']='targets_present'; json.dump(x,open(p,'w'))
          PY
          test "$(sha256sum "$RUNNER_TEMP/tampered.json" | cut -d' ' -f1)" != "$(sha256sum "$RUNNER_TEMP/out-a/evidence.json" | cut -d' ' -f1)"
