name: Core SBOM Syft 16.1.10 qualification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CORE_PR_HEAD: af091e792777073b2ce40455c65bd4df7aea1e68
  SYFT_VERSION: 1.52.0
  SYFT_TAR_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
  SYFT_SBOM_SHA256: ad9650592aec53f318295b2531120426b9edd83db797037bc10924278d40ae91
  SECOND_REF: ghcr.io/github/github-mcp-server@sha256:a44e77b9c9003ed0e228716d118aa4ce9f3418dce30fe2340c71553164bd96f0
  REQUESTED_DIGEST: sha256:a44e77b9c9003ed0e228716d118aa4ce9f3418dce30fe2340c71553164bd96f0
  RESOLVED_DIGEST: sha256:b2814a05586591dd361d361c26bbb1e1154cfbc1544fca32785fde5e11270d07

jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 24}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with: {version: 10.33.4}
      - name: Fetch immutable inputs and PR HEAD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/syft" "$RUNNER_TEMP/oci"
          base="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}"
          curl -fsSL "$base/syft_${SYFT_VERSION}_linux_amd64.tar.gz" -o "$RUNNER_TEMP/syft/release.tar.gz"
          curl -fsSL "$base/syft_${SYFT_VERSION}_linux_amd64.sbom" -o "$RUNNER_TEMP/syft/release.sbom.json"
          echo "${SYFT_TAR_SHA256}  $RUNNER_TEMP/syft/release.tar.gz" | sha256sum --check --strict
          echo "${SYFT_SBOM_SHA256}  $RUNNER_TEMP/syft/release.sbom.json" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/syft/release.tar.gz" -C "$RUNNER_TEMP/syft"
          echo "SYFT_BINARY_SHA256=$(sha256sum "$RUNNER_TEMP/syft/syft" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          docker buildx imagetools inspect --raw "$SECOND_REF" > "$RUNNER_TEMP/oci/second.json"
          test "sha256:$(sha256sum "$RUNNER_TEMP/oci/second.json" | cut -d' ' -f1)" = "$REQUESTED_DIGEST"
          "$RUNNER_TEMP/syft/syft" "$SECOND_REF" -o "syft-json=$RUNNER_TEMP/oci/second.sbom.json"
          node --input-type=module - "$RUNNER_TEMP/oci/second.sbom.json" "$RUNNER_TEMP/oci/resolved.json" <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const [sbomPath, resolvedPath] = process.argv.slice(2);
          const sbom = JSON.parse((await readFile(sbomPath)).toString());
          const encoded = sbom.source?.metadata?.manifest;
          if (typeof encoded !== 'string') throw new Error('Syft source.metadata.manifest missing');
          await writeFile(resolvedPath, Buffer.from(encoded, 'base64'));
          NODE
          test "sha256:$(sha256sum "$RUNNER_TEMP/oci/resolved.json" | cut -d' ' -f1)" = "$RESOLVED_DIGEST"
          git clone https://github.com/Xander-Xai/mcp-evidence-gate.git "$RUNNER_TEMP/core"
          git -C "$RUNNER_TEMP/core" checkout --detach "$CORE_PR_HEAD"
          pnpm --dir "$RUNNER_TEMP/core" install --frozen-lockfile
          pnpm --dir "$RUNNER_TEMP/core" build
      - name: Execute cross-schema hosted admission controls
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - "$RUNNER_TEMP/core" "$RUNNER_TEMP/syft" "$RUNNER_TEMP/oci" "$RUNNER_TEMP/result.json" <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { join } from 'node:path';
          const core=process.argv[2], syftRoot=process.argv[3], ociRoot=process.argv[4], output=process.argv[5];
          const { verifySbomEvidence } = await import(core + '/dist/core/sbom.js');
          const digest=b=>`sha256:${createHash('sha256').update(b).digest('hex')}`;
          const releasePath=join(syftRoot,'release.tar.gz'), releaseSbomPath=join(syftRoot,'release.sbom.json');
          const secondPath=join(ociRoot,'second.json'), resolvedPath=join(ociRoot,'resolved.json'), secondSbomPath=join(ociRoot,'second.sbom.json');
          const release=await readFile(releasePath), releaseSbom=await readFile(releaseSbomPath), second=await readFile(secondPath), resolved=await readFile(resolvedPath), secondSbom=await readFile(secondSbomPath);
          const makeEnvelope=(artifactBytes,sbomBytes,document,ref,schemaVersion,options={})=>({
            schema_version:'project-defined-sbom-evidence-v1',
            artifact:{ref,sha256:digest(artifactBytes),size:artifactBytes.length},
            sbom:{format:'syft-json',schema_version:schemaVersion,sha256:digest(sbomBytes),size:sbomBytes.length},
            relationship:{type:'generated-from',artifact_sha256:options.relationshipArtifact ?? digest(artifactBytes),sbom_sha256:digest(sbomBytes),binding:options.binding ?? 'exact-artifact'},
            inventory:{status:'present',package_count:document.artifacts.length}
          });
          const releaseDoc=JSON.parse(releaseSbom.toString()), secondDoc=JSON.parse(secondSbom.toString());
          const rA=await verifySbomEvidence(releasePath,makeEnvelope(release,releaseSbom,releaseDoc,'syft_1.52.0_linux_amd64.tar.gz','16.1.3'),releaseSbom);
          const sA=await verifySbomEvidence(resolvedPath,makeEnvelope(resolved,secondSbom,secondDoc,process.env.SECOND_REF,'16.1.10'),secondSbom);
          const requestedControl=await verifySbomEvidence(secondPath,makeEnvelope(second,secondSbom,secondDoc,process.env.SECOND_REF,'16.1.10'),secondSbom);
          const tampered=Buffer.concat([secondSbom,Buffer.from('\n')]);
          const sB=await verifySbomEvidence(resolvedPath,makeEnvelope(resolved,secondSbom,secondDoc,process.env.SECOND_REF,'16.1.10'),tampered);
          const sC=await verifySbomEvidence(resolvedPath,makeEnvelope(resolved,secondSbom,secondDoc,process.env.SECOND_REF,'16.1.10',{relationshipArtifact:'sha256:'+'0'.repeat(64)}),secondSbom);
          const sD=await verifySbomEvidence(resolvedPath,makeEnvelope(resolved,secondSbom,secondDoc,process.env.SECOND_REF,'16.1.10',{binding:'same-release'}),secondSbom);
          const futureDoc={...secondDoc,schema:{...secondDoc.schema,version:'16.1.11'}};
          const futureBytes=Buffer.from(JSON.stringify(futureDoc));
          const sE=await verifySbomEvidence(resolvedPath,makeEnvelope(resolved,futureBytes,futureDoc,process.env.SECOND_REF,'16.1.11'),futureBytes);
          const mutateSource=async(mutator)=>{const doc=JSON.parse(JSON.stringify(secondDoc));mutator(doc.source);const bytes=Buffer.from(JSON.stringify(doc));return verifySbomEvidence(secondPath,makeEnvelope(second,bytes,doc,process.env.SECOND_REF,'16.1.10'),bytes);};
          const mutateResolvedSource=async(mutator)=>{const doc=JSON.parse(JSON.stringify(secondDoc));mutator(doc.source);const bytes=Buffer.from(JSON.stringify(doc));return verifySbomEvidence(resolvedPath,makeEnvelope(resolved,bytes,doc,process.env.SECOND_REF,'16.1.10'),bytes);};
          const mutateFileSource=async(mutator)=>{const doc=JSON.parse(JSON.stringify(releaseDoc));mutator(doc.source);const bytes=Buffer.from(JSON.stringify(doc));return verifySbomEvidence(releasePath,makeEnvelope(release,bytes,doc,'syft_1.52.0_linux_amd64.tar.gz','16.1.3'),bytes);};
          const imageToFile=await mutateSource(source=>{source.type='file';});
          const manifestPresentFile=await mutateSource(source=>{source.type='file';});
          const manifestDeletedFile=await mutateSource(source=>{source.type='file';delete source.metadata.manifestDigest;});
          const manifestNullFile=await mutateSource(source=>{source.type='file';source.metadata.manifestDigest=null;});
          const imageIdOnly=await mutateSource(source=>{source.type='file';delete source.metadata.manifestDigest;delete source.metadata.layers;delete source.metadata.manifest;delete source.metadata.userInput;});
          const layersOnly=await mutateSource(source=>{source.type='file';delete source.metadata.manifestDigest;delete source.metadata.imageID;delete source.metadata.manifest;delete source.metadata.userInput;});
          const embeddedManifestOnly=await mutateSource(source=>{source.type='file';delete source.metadata.manifestDigest;delete source.metadata.imageID;delete source.metadata.layers;delete source.metadata.userInput;});
          const imageTypeMissing=await mutateSource(source=>{delete source.type;});
          const imageTypeUnknown=await mutateSource(source=>{source.type='unknown-test-type';});
          const manifestNull=await mutateResolvedSource(source=>{source.metadata.manifestDigest=null;});
          const manifestEmpty=await mutateResolvedSource(source=>{source.metadata.manifestDigest='';});
          const manifestWrongType=await mutateResolvedSource(source=>{source.metadata.manifestDigest=123;});
          const sourceIdNull=await mutateResolvedSource(source=>{source.id=null;});
          const bothAbsent=await mutateResolvedSource(source=>{delete source.id;delete source.metadata.manifestDigest;});
          const fileShaNull=await mutateFileSource(source=>{source.metadata.digests=[{algorithm:'sha256',value:null}];});
          const fileShaInvalid=await mutateFileSource(source=>{source.metadata.digests=[{algorithm:'sha256',value:'not-a-digest'}];});
          const fileShaMixed=await mutateFileSource(source=>{source.metadata.digests=[{algorithm:'sha256',value:digest(release) .slice(7)},{algorithm:'sha256',value:null}];});
          const embeddedManifestTamper=await mutateResolvedSource(source=>{source.metadata.manifest=Buffer.from('{}').toString('base64');});
          const imageIdTamper=await mutateResolvedSource(source=>{source.metadata.imageID='sha256:'+'0'.repeat(64);});
          const imageIdNoEmbedded=await mutateResolvedSource(source=>{delete source.metadata.manifest;source.metadata.imageID='sha256:'+'0'.repeat(64);});
          const configTamper=await mutateResolvedSource(source=>{source.metadata.config=Buffer.from('tampered-config').toString('base64');});
          const configNoImageId=await mutateResolvedSource(source=>{delete source.metadata.imageID;delete source.metadata.architecture;delete source.metadata.os;delete source.metadata.layers;});
          const configNoImageIdTamper=await mutateResolvedSource(source=>{delete source.metadata.imageID;delete source.metadata.architecture;delete source.metadata.os;delete source.metadata.layers;source.metadata.config=Buffer.from(JSON.stringify({architecture:'amd64',os:'linux'})).toString('base64');});
          const configFallbackNoImageId=await mutateResolvedSource(source=>{delete source.metadata.manifest;delete source.metadata.imageID;delete source.metadata.architecture;delete source.metadata.os;delete source.metadata.layers;});
          const configFallbackNoImageIdTamper=await mutateResolvedSource(source=>{delete source.metadata.manifest;delete source.metadata.imageID;delete source.metadata.architecture;delete source.metadata.os;delete source.metadata.layers;source.metadata.config=Buffer.from(JSON.stringify({architecture:'amd64',os:'linux'})).toString('base64');});
          const residualDowngrade=async(field)=>mutateSource(source=>{const value=source.metadata[field];source.type='file';source.metadata={path:'synthetic-path',[field]:value};});
          const mediaTypeDowngrade=await residualDowngrade('mediaType');
          const imageSizeDowngrade=await residualDowngrade('imageSize');
          const repoDigestsDowngrade=await residualDowngrade('repoDigests');
          const tagsDowngrade=await residualDowngrade('tags');
          const labelsDowngrade=await residualDowngrade('labels');
          const layersNoManifestNoImageId=await mutateResolvedSource(source=>{delete source.metadata.manifest;delete source.metadata.imageID;});
          const layerMismatch=await mutateResolvedSource(source=>{delete source.metadata.manifest;delete source.metadata.imageID;source.metadata.layers[0].digest='sha256:'+'0'.repeat(64);});
          const layerMissing=await mutateResolvedSource(source=>{delete source.metadata.manifest;delete source.metadata.imageID;source.metadata.layers.pop();});
          const layerMalformed=await mutateResolvedSource(source=>{delete source.metadata.manifest;delete source.metadata.imageID;source.metadata.layers[0]={digest:'invalid'};});
          const layerReordered=await mutateResolvedSource(source=>{delete source.metadata.manifest;delete source.metadata.imageID;[source.metadata.layers[0],source.metadata.layers[1]]=[source.metadata.layers[1],source.metadata.layers[0]];});
          const allBlocked=[imageToFile,manifestPresentFile,manifestDeletedFile,manifestNullFile,imageIdOnly,layersOnly,embeddedManifestOnly,imageTypeUnknown,manifestNull,manifestEmpty,manifestWrongType,sourceIdNull,fileShaNull,fileShaInvalid,fileShaMixed,embeddedManifestTamper,imageIdTamper,imageIdNoEmbedded,configTamper,configNoImageIdTamper,configFallbackNoImageIdTamper,mediaTypeDowngrade,imageSizeDowngrade,repoDigestsDowngrade,tagsDowngrade,labelsDowngrade,layerMismatch,layerMissing,layerMalformed,layerReordered].every(result=>result.status==='blocked'&&result.reasonCodes.includes('artifact_sbom_binding_mismatch'));
          if(rA.status!=='pass'||rA.schemaVersion!=='16.1.3'||rA.packageCount!==275||sA.status!=='pass'||sA.schemaVersion!=='16.1.10'||sA.packageCount!==41||requestedControl.status==='pass'||sB.status!=='blocked'||!sB.reasonCodes.includes('sbom_digest_mismatch')||sC.status!=='blocked'||!sC.reasonCodes.includes('artifact_sbom_binding_mismatch')||sD.status!=='inconclusive'||!sD.reasonCodes.includes('artifact_sbom_binding_missing')||sE.status!=='inconclusive'||!sE.reasonCodes.includes('sbom_schema_unsupported')||!allBlocked||configNoImageId.status!=='pass'||configFallbackNoImageId.status!=='pass'||layersNoManifestNoImageId.status!=='pass'||imageTypeMissing.status!=='inconclusive'||bothAbsent.status!=='inconclusive'||!bothAbsent.reasonCodes.includes('artifact_sbom_binding_missing')) throw new Error(JSON.stringify({rA,sA,requestedControl,sB,sC,sD,sE,imageToFile,manifestPresentFile,manifestDeletedFile,manifestNullFile,imageIdOnly,layersOnly,embeddedManifestOnly,imageTypeMissing,imageTypeUnknown,manifestNull,manifestEmpty,manifestWrongType,sourceIdNull,bothAbsent,fileShaNull,fileShaInvalid,fileShaMixed,embeddedManifestTamper,imageIdTamper,imageIdNoEmbedded,configTamper,configNoImageId,configNoImageIdTamper,configFallbackNoImageId,configFallbackNoImageIdTamper,mediaTypeDowngrade,imageSizeDowngrade,repoDigestsDowngrade,tagsDowngrade,labelsDowngrade,layersNoManifestNoImageId,layerMismatch,layerMissing,layerMalformed,layerReordered}));
          await writeFile(output,JSON.stringify({core_pr_head:process.env.CORE_PR_HEAD,syft_version:process.env.SYFT_VERSION,syft_binary_sha256:process.env.SYFT_BINARY_SHA256,requested_reference_digest:process.env.REQUESTED_DIGEST,resolved_scan_manifest_digest:process.env.RESOLVED_DIGEST,real_16_1_3:{artifact_digest:digest(release),sbom_digest:digest(releaseSbom),schema:releaseDoc.schema.version,descriptor_version:releaseDoc.descriptor.version,package_count:releaseDoc.artifacts.length,result:rA},real_16_1_10:{requested_artifact_ref:process.env.SECOND_REF,artifact_ref:process.env.SECOND_REF,artifact_digest:digest(resolved),sbom_digest:digest(secondSbom),schema:secondDoc.schema.version,source:secondDoc.source,package_count:secondDoc.artifacts.length,result:sA},a44e_as_artifact_control:requestedControl,file_sha256_null_control:fileShaNull,file_sha256_invalid_control:fileShaInvalid,file_sha256_mixed_control:fileShaMixed,embedded_manifest_tamper_control:embeddedManifestTamper,image_id_tamper_control:imageIdTamper,image_id_without_embedded_manifest_control:imageIdNoEmbedded,config_tamper_control:configTamper,config_no_imageid_control:configNoImageId,config_no_imageid_tamper_control:configNoImageIdTamper,config_fallback_no_imageid_control:configFallbackNoImageId,config_fallback_no_imageid_tamper_control:configFallbackNoImageIdTamper,image_to_file_downgrade_control:imageToFile,media_type_downgrade_control:mediaTypeDowngrade,image_size_downgrade_control:imageSizeDowngrade,repo_digests_downgrade_control:repoDigestsDowngrade,tags_downgrade_control:tagsDowngrade,labels_downgrade_control:labelsDowngrade,layers_no_manifest_no_imageid_control:layersNoManifestNoImageId,layer_mismatch_control:layerMismatch,layer_missing_control:layerMissing,layer_malformed_control:layerMalformed,layer_reordered_control:layerReordered,type_file_manifest_digest_present_control:manifestPresentFile,type_file_manifest_digest_deleted_control:manifestDeletedFile,type_file_manifest_digest_null_control:manifestNullFile,image_id_only_downgrade_control:imageIdOnly,layers_only_downgrade_control:layersOnly,embedded_manifest_downgrade_control:embeddedManifestOnly,image_type_missing_control:imageTypeMissing,image_type_unknown_control:imageTypeUnknown,manifest_digest_null_control:manifestNull,manifest_digest_empty_control:manifestEmpty,manifest_digest_wrong_type_control:manifestWrongType,source_id_null_control:sourceIdNull,both_resolved_identities_absent_control:bothAbsent,tamper_16_1_10:sB,mismatch_16_1_10:sC,unsupported_relationship_16_1_10:sD,future_16_1_11_control:sE,classification:'DIFFERENT_IMAGE_CONTENT_RESOLVED_SCAN_SUBJECT',producer_generalization:'NOT_PROVEN'},null,2));
          JS
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-sbom-syft-16-1-10-qualification-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/result.json
