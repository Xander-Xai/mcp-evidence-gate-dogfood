name: Core SBOM Syft 16.1.10 qualification

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CORE_PR_HEAD: c32a6720486e2db916070e5489859f01000eb515
  SYFT_VERSION: 1.52.0
  SYFT_TAR_SHA256: caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d
  SYFT_SBOM_SHA256: ad9650592aec53f318295b2531120426b9edd83db797037bc10924278d40ae91
  SECOND_REF: ghcr.io/github/github-mcp-server@sha256:a44e77b9c9003ed0e228716d118aa4ce9f3418dce30fe2340c71553164bd96f0
  SECOND_DIGEST: sha256:a44e77b9c9003ed0e228716d118aa4ce9f3418dce30fe2340c71553164bd96f0

jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 24}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with: {version: 10.33.4}
      - name: Fetch immutable inputs and PR HEAD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/syft" "$RUNNER_TEMP/oci"
          base="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}"
          curl -fsSL "$base/syft_${SYFT_VERSION}_linux_amd64.tar.gz" -o "$RUNNER_TEMP/syft/release.tar.gz"
          curl -fsSL "$base/syft_${SYFT_VERSION}_linux_amd64.sbom" -o "$RUNNER_TEMP/syft/release.sbom.json"
          echo "${SYFT_TAR_SHA256}  $RUNNER_TEMP/syft/release.tar.gz" | sha256sum --check --strict
          echo "${SYFT_SBOM_SHA256}  $RUNNER_TEMP/syft/release.sbom.json" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/syft/release.tar.gz" -C "$RUNNER_TEMP/syft"
          echo "SYFT_BINARY_SHA256=$(sha256sum "$RUNNER_TEMP/syft/syft" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          docker buildx imagetools inspect --raw "$SECOND_REF" > "$RUNNER_TEMP/oci/second.json"
          test "sha256:$(sha256sum "$RUNNER_TEMP/oci/second.json" | cut -d' ' -f1)" = "$SECOND_DIGEST"
          "$RUNNER_TEMP/syft/syft" "$SECOND_REF" -o "syft-json=$RUNNER_TEMP/oci/second.sbom.json"
          git clone https://github.com/Xander-Xai/mcp-evidence-gate.git "$RUNNER_TEMP/core"
          git -C "$RUNNER_TEMP/core" checkout --detach "$CORE_PR_HEAD"
          pnpm --dir "$RUNNER_TEMP/core" install --frozen-lockfile
          pnpm --dir "$RUNNER_TEMP/core" build
      - name: Execute cross-schema hosted admission controls
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - "$RUNNER_TEMP/core" "$RUNNER_TEMP/syft" "$RUNNER_TEMP/oci" "$RUNNER_TEMP/result.json" <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { join } from 'node:path';
          const core=process.argv[2], syftRoot=process.argv[3], ociRoot=process.argv[4], output=process.argv[5];
          const { verifySbomEvidence } = await import(core + '/dist/core/sbom.js');
          const digest=b=>`sha256:${createHash('sha256').update(b).digest('hex')}`;
          const releasePath=join(syftRoot,'release.tar.gz'), releaseSbomPath=join(syftRoot,'release.sbom.json');
          const secondPath=join(ociRoot,'second.json'), secondSbomPath=join(ociRoot,'second.sbom.json');
          const release=await readFile(releasePath), releaseSbom=await readFile(releaseSbomPath), second=await readFile(secondPath), secondSbom=await readFile(secondSbomPath);
          const makeEnvelope=(artifactBytes,sbomBytes,document,ref,schemaVersion,options={})=>({
            schema_version:'project-defined-sbom-evidence-v1',
            artifact:{ref,sha256:digest(artifactBytes),size:artifactBytes.length},
            sbom:{format:'syft-json',schema_version:schemaVersion,sha256:digest(sbomBytes),size:sbomBytes.length},
            relationship:{type:'generated-from',artifact_sha256:options.relationshipArtifact ?? digest(artifactBytes),sbom_sha256:digest(sbomBytes),binding:options.binding ?? 'exact-artifact'},
            inventory:{status:'present',package_count:document.artifacts.length}
          });
          const releaseDoc=JSON.parse(releaseSbom.toString()), secondDoc=JSON.parse(secondSbom.toString());
          const rA=await verifySbomEvidence(releasePath,makeEnvelope(release,releaseSbom,releaseDoc,'syft_1.52.0_linux_amd64.tar.gz','16.1.3'),releaseSbom);
          const sA=await verifySbomEvidence(secondPath,makeEnvelope(second,secondSbom,secondDoc,process.env.SECOND_REF,'16.1.10'),secondSbom);
          const tampered=Buffer.concat([secondSbom,Buffer.from('\n')]);
          const sB=await verifySbomEvidence(secondPath,makeEnvelope(second,secondSbom,secondDoc,process.env.SECOND_REF,'16.1.10'),tampered);
          const sC=await verifySbomEvidence(secondPath,makeEnvelope(second,secondSbom,secondDoc,process.env.SECOND_REF,'16.1.10',{relationshipArtifact:'sha256:'+'0'.repeat(64)}),secondSbom);
          const sD=await verifySbomEvidence(secondPath,makeEnvelope(second,secondSbom,secondDoc,process.env.SECOND_REF,'16.1.10',{binding:'same-release'}),secondSbom);
          const futureDoc={...secondDoc,schema:{...secondDoc.schema,version:'16.1.11'}};
          const futureBytes=Buffer.from(JSON.stringify(futureDoc));
          const sE=await verifySbomEvidence(secondPath,makeEnvelope(second,futureBytes,futureDoc,process.env.SECOND_REF,'16.1.11'),futureBytes);
          if(rA.status!=='pass'||rA.schemaVersion!=='16.1.3'||rA.packageCount!==275||sA.status!=='pass'||sA.schemaVersion!=='16.1.10'||sA.packageCount!==41||sB.status!=='blocked'||!sB.reasonCodes.includes('sbom_digest_mismatch')||sC.status!=='blocked'||!sC.reasonCodes.includes('artifact_sbom_binding_mismatch')||sD.status!=='inconclusive'||!sD.reasonCodes.includes('artifact_sbom_binding_missing')||sE.status!=='inconclusive'||!sE.reasonCodes.includes('sbom_schema_unsupported')) throw new Error(JSON.stringify({rA,sA,sB,sC,sD,sE}));
          await writeFile(output,JSON.stringify({core_pr_head:process.env.CORE_PR_HEAD,syft_version:process.env.SYFT_VERSION,syft_binary_sha256:process.env.SYFT_BINARY_SHA256,real_16_1_3:{artifact_digest:digest(release),sbom_digest:digest(releaseSbom),schema:releaseDoc.schema.version,descriptor_version:releaseDoc.descriptor.version,package_count:releaseDoc.artifacts.length,result:rA},real_16_1_10:{artifact_ref:process.env.SECOND_REF,artifact_digest:digest(second),sbom_digest:digest(secondSbom),schema:secondDoc.schema.version,source:secondDoc.source,package_count:secondDoc.artifacts.length,result:sA},tamper_16_1_10:sB,mismatch_16_1_10:sC,unsupported_relationship_16_1_10:sD,future_16_1_11_control:sE,classification:'CROSS_ARTIFACT_CROSS_PROJECT_GENERALIZED',producer_generalization:'NOT_PROVEN'},null,2));
          JS
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-sbom-syft-16-1-10-qualification-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/result.json
