name: Real OSV Producer Consumer

on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/real-osv-producer.yml
      - evidence/real-trivy/requirements.txt
      - scripts/run_osv_source_binding_acceptance.py

permissions:
  contents: read

jobs:
  real-osv-producer-consumer:
    runs-on: ubuntu-latest
    env:
      PRODUCER_SHA: 32eb55168b82991df689c943ae23fbb0ae6867dd
      GATE_SHA: 52c224b36a54e450dbe25ad56988f29e4795753e
      OSV_VERSION: 2.5.1
      OSV_EXECUTABLE_SHA256: f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download and verify pinned OSV-Scanner
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_EXECUTABLE_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"
          actual_version="$("$RUNNER_TEMP/osv-scanner" --version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          test "$actual_version" = "$OSV_VERSION"

      - name: Check out immutable reviewed producer
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Xander-Xai/mcp-evidence-producer-trivy.git "$RUNNER_TEMP/producer"
          git -C "$RUNNER_TEMP/producer" checkout --detach "$PRODUCER_SHA"
          test "$(git -C "$RUNNER_TEMP/producer" rev-parse HEAD)" = "$PRODUCER_SHA"

      - name: Check out immutable Core action bundle
        uses: actions/checkout@v4
        with:
          repository: Xander-Xai/mcp-evidence-gate
          ref: ${{ env.GATE_SHA }}
          path: .core
          fetch-depth: 1

      - name: Assert immutable Core action head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .core rev-parse HEAD)" = "$GATE_SHA"

      - name: Run real OSV producer against consumer-owned artifact
        shell: bash
        run: |
          set -euo pipefail
          python -m src.osv_producer \
            --osv "$RUNNER_TEMP/osv-scanner" \
            --artifact "$GITHUB_WORKSPACE/evidence/real-trivy/requirements.txt" \
            --out "$RUNNER_TEMP/producer-out"
        working-directory: ${{ runner.temp }}/producer

      - name: Record OSV runtime evidence facts
        id: facts
        shell: bash
        run: |
          set -euo pipefail
          artifact='evidence/real-trivy/requirements.txt'
          out="$RUNNER_TEMP/producer-out"
          artifact_digest="sha256:$(sha256sum "$artifact" | cut -d ' ' -f 1)"
          evidence_digest="sha256:$(sha256sum "$out/evidence.json" | cut -d ' ' -f 1)"
          receipt_digest="sha256:$(sha256sum "$out/receipt.json" | cut -d ' ' -f 1)"
          raw_report_digest="sha256:$(sha256sum "$out/osv.raw.json" | cut -d ' ' -f 1)"
          receipt_verdict="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["verdict"])' "$out/receipt.json")"
          scanner_exit="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["invocation"]["exit_code"])' "$out/evidence.json")"
          source_types="$(python -c 'import json,sys; print(",".join(sorted({r.get("source",{}).get("type","missing") for r in json.load(open(sys.argv[1], encoding="utf-8")).get("results",[])})))' "$out/osv.raw.json")"
          python - "$artifact_digest" "$evidence_digest" "$receipt_digest" "$raw_report_digest" "$receipt_verdict" "$scanner_exit" "$source_types" "$out" "$RUNNER_TEMP/runtime-evidence-manifest.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          artifact_digest, evidence_digest, receipt_digest, raw_report_digest, receipt_verdict, scanner_exit, source_types, output_dir, manifest_path = sys.argv[1:]
          receipt = json.load(open(f"{output_dir}/receipt.json", encoding="utf-8"))
          evidence = json.load(open(f"{output_dir}/evidence.json", encoding="utf-8"))
          raw = json.load(open(f"{output_dir}/osv.raw.json", encoding="utf-8"))
          expected_artifact = (Path(os.environ["GITHUB_WORKSPACE"]) / "evidence/real-trivy/requirements.txt").resolve()

          assert receipt["scanner"] == "osv-scanner"
          assert receipt["scanner_version"] == os.environ["OSV_VERSION"]
          assert receipt["scanned_artifact_digest"] == artifact_digest
          assert Path(receipt["scanned_artifact_ref"]).resolve() == expected_artifact
          assert receipt["evidence_digest"] == evidence_digest
          assert receipt["verdict"] == receipt_verdict
          assert receipt_verdict in {"clean", "findings"}
          assert evidence["artifact"]["sha256"] == artifact_digest.removeprefix("sha256:")
          assert Path(evidence["artifact"]["ref"]).resolve() == expected_artifact
          assert evidence["raw_report"]["sha256"] == raw_report_digest.removeprefix("sha256:")
          assert evidence["scanner"]["name"] == "osv-scanner"
          assert evidence["scanner"]["version"] == os.environ["OSV_VERSION"]
          assert evidence["scanner"]["binary_sha256"] == os.environ["OSV_EXECUTABLE_SHA256"]
          execution = evidence["scanner_execution"]
          assert execution["schema_version"] == "project-defined-scanner-execution-v1"
          assert execution["completeness_status"] == "complete"
          assert execution["required_work_completed"] is True
          assert execution["result_semantics_consistent"] is True
          assert evidence["scanner_database"]["source"] == "https://osv.dev"
          assert evidence["scanner_database"]["mode"] == "remote-query"
          assert evidence["scanner_database"]["snapshot"] == "unavailable"
          assert int(scanner_exit) in {0, 1}
          assert isinstance(raw.get("results"), list) and raw["results"]

          sources = [result.get("source", {}) for result in raw["results"]]
          assert all(Path(source["path"]).resolve() == expected_artifact for source in sources)
          observed_source_types = {source.get("type") for source in sources}
          assert observed_source_types <= {"lockfile", "unknown"}
          assert "lockfile" in observed_source_types
          assert observed_source_types == set(source_types.split(","))

          manifest = {
              "schema_version": "dogfood-runtime-evidence-v1",
              "dogfood_commit": os.environ["GITHUB_SHA"],
              "producer_commit": os.environ["PRODUCER_SHA"],
              "gate_commit": os.environ["GATE_SHA"],
              "osv_version": os.environ["OSV_VERSION"],
              "osv_executable_sha256": "sha256:" + os.environ["OSV_EXECUTABLE_SHA256"],
              "artifact_digest": artifact_digest,
              "raw_report_digest": raw_report_digest,
              "evidence_digest": evidence_digest,
              "receipt_digest": receipt_digest,
              "receipt_verdict": receipt_verdict,
              "scanner_exit_code": int(scanner_exit),
              "source_types": sorted(observed_source_types),
              "scanner_execution": evidence["scanner_execution"],
              "scanner_database": evidence["scanner_database"],
          }
          with open(manifest_path, "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, sort_keys=True)
              f.write("\n")
          PY
          {
            echo "artifact_digest=$artifact_digest"
            echo "raw_report_digest=$raw_report_digest"
            echo "evidence_digest=$evidence_digest"
            echo "receipt_digest=$receipt_digest"
            echo "receipt_verdict=$receipt_verdict"
            echo "scanner_exit=$scanner_exit"
            echo "source_types=$source_types"
          } >> "$GITHUB_OUTPUT"

      - name: Verify real OSV evidence with immutable gate
        id: gate
        continue-on-error: true
        env:
          INPUT_RECEIPT: ${{ runner.temp }}/producer-out/receipt.json
          INPUT_ARTIFACT: evidence/real-trivy/requirements.txt
          INPUT_EVIDENCE: ${{ runner.temp }}/producer-out/evidence.json
          INPUT_POLICY: permissive
        shell: bash
        run: |
          set +e
          node "$GITHUB_WORKSPACE/.core/dist/action/index.cjs"
          code=$?
          set -e
          exit "$code"

      - name: Assert dynamic OSV gate decision and Action outcome
        if: always()
        env:
          ACTUAL_DECISION: ${{ steps.gate.outputs.decision }}
          ACTUAL_VERDICT: ${{ steps.gate.outputs.receipt-verdict }}
          ACTUAL_OUTCOME: ${{ steps.gate.outcome }}
          PRODUCER_VERDICT: ${{ steps.facts.outputs.receipt_verdict }}
        shell: bash
        run: |
          set -euo pipefail
          case "$PRODUCER_VERDICT" in
            clean) expected_decision=pass ;;
            findings) expected_decision=fail ;;
            *) echo "unsupported producer verdict: $PRODUCER_VERDICT" >&2; exit 1 ;;
          esac
          case "$expected_decision" in
            pass) expected_outcome=success ;;
            fail) expected_outcome=failure ;;
          esac
          test "$ACTUAL_VERDICT" = "$PRODUCER_VERDICT"
          test "$ACTUAL_DECISION" = "$expected_decision"
          test "$ACTUAL_OUTCOME" = "$expected_outcome"
          python - "$RUNNER_TEMP/runtime-evidence-manifest.json" "$ACTUAL_DECISION" "$ACTUAL_OUTCOME" <<'PY'
          import json
          import sys
          path, decision, outcome = sys.argv[1:]
          data = json.load(open(path, encoding="utf-8"))
          data["gate_decision"] = decision
          data["gate_step_outcome"] = outcome
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, sort_keys=True)
              f.write("\n")
          PY
          {
            echo "## Real OSV producer-consumer evidence"
            echo
            echo "| Field | Runtime value |"
            echo "| --- | --- |"
            echo "| Producer reviewed commit | \`$PRODUCER_SHA\` |"
            echo "| Gate commit | \`$GATE_SHA\` |"
            echo "| OSV-Scanner | \`$OSV_VERSION\` |"
            echo "| Artifact digest | \`${{ steps.facts.outputs.artifact_digest }}\` |"
            echo "| Raw report digest | \`${{ steps.facts.outputs.raw_report_digest }}\` |"
            echo "| Evidence digest | \`${{ steps.facts.outputs.evidence_digest }}\` |"
            echo "| Receipt digest | \`${{ steps.facts.outputs.receipt_digest }}\` |"
            echo "| Scanner exit | \`${{ steps.facts.outputs.scanner_exit }}\` |"
            echo "| Source types | \`${{ steps.facts.outputs.source_types }}\` |"
            echo "| DB snapshot | \`unavailable\` |"
            echo "| Receipt verdict | \`$PRODUCER_VERDICT\` |"
            echo "| Scanner execution | \`complete\` |"
            echo "| Gate decision | \`$ACTUAL_DECISION\` |"
            echo "| Gate step outcome | \`$ACTUAL_OUTCOME\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OSV runtime evidence bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-osv-runtime-evidence-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/runtime-evidence-manifest.json
            ${{ runner.temp }}/producer-out/receipt.json
            ${{ runner.temp }}/producer-out/evidence.json
            ${{ runner.temp }}/producer-out/osv.raw.json
            ${{ runner.temp }}/producer-out/osv.stderr.log

  source-binding-mismatch-acceptance:
    name: OSV source_binding mismatch acceptance
    runs-on: ubuntu-latest
    env:
      PRODUCER_SHA: 32eb55168b82991df689c943ae23fbb0ae6867dd
      GATE_SHA: 52c224b36a54e450dbe25ad56988f29e4795753e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Check out immutable Producer PR head
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Xander-Xai/mcp-evidence-producer-trivy.git "$RUNNER_TEMP/producer"
          git -C "$RUNNER_TEMP/producer" checkout --detach "$PRODUCER_SHA"
          test "$(git -C "$RUNNER_TEMP/producer" rev-parse HEAD)" = "$PRODUCER_SHA"

      - name: Run deterministic OSV source_binding mismatch acceptance
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/wrong-requirements.txt" <<'PY'
          from pathlib import Path
          import sys
          Path(sys.argv[1]).write_text("typing_extensions==4.12.2\n", encoding="utf-8")
          PY
          python scripts/run_osv_source_binding_acceptance.py \
            --producer-root "$RUNNER_TEMP/producer" \
            --binary /bin/sh \
            --artifact "$GITHUB_WORKSPACE/evidence/real-trivy/requirements.txt" \
            --wrong-source "$RUNNER_TEMP/wrong-requirements.txt" \
            --out "$RUNNER_TEMP/source-binding" \
            --producer-sha "$PRODUCER_SHA" \
            --core-sha "$GATE_SHA"

      - name: Capture Core evaluation timestamp after Producer
        id: evaluation_time
        shell: bash
        run: |
          set -euo pipefail
          PRODUCER_SCANNED_AT="$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["scanned_at"])' \
            "$RUNNER_TEMP/source-binding/receipt.json")"
          CORE_EVALUATION_NOW="$(python scripts/capture_core_evaluation_timestamp.py \
            --receipt "$RUNNER_TEMP/source-binding/receipt.json")"
          echo "PRODUCER_SCANNED_AT=$PRODUCER_SCANNED_AT" >> "$GITHUB_ENV"
          echo "CORE_EVALUATION_NOW=$CORE_EVALUATION_NOW" >> "$GITHUB_ENV"
          echo "EVALUATION_TIMESTAMP_SOURCE=runtime_after_producer" >> "$GITHUB_ENV"
          echo "core_evaluation_now=$CORE_EVALUATION_NOW" >> "$GITHUB_OUTPUT"

      - name: Build immutable Core Gate
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Xander-Xai/mcp-evidence-gate.git "$RUNNER_TEMP/core"
          git -C "$RUNNER_TEMP/core" checkout --detach "$GATE_SHA"
          test "$(git -C "$RUNNER_TEMP/core" rev-parse HEAD)" = "$GATE_SHA"
          pnpm --dir "$RUNNER_TEMP/core" install --frozen-lockfile
          pnpm --dir "$RUNNER_TEMP/core" build

      - name: Verify source_binding mismatch with strict Core
        id: core
        shell: bash
        run: |
          set +e
          node "$RUNNER_TEMP/core/dist/cli.js" verify \
            --receipt "$RUNNER_TEMP/source-binding/receipt.json" \
            --artifact "$GITHUB_WORKSPACE/evidence/real-trivy/requirements.txt" \
            --evidence "$RUNNER_TEMP/source-binding/evidence.json" \
            --policy strict-scanner-completeness --format json --now "$CORE_EVALUATION_NOW" \
            > "$RUNNER_TEMP/source-binding/core.json"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Evaluate source_binding mismatch with Dogfood policy
        id: policy
        shell: bash
        run: |
          set +e
          python scripts/scanner_completeness_policy.py \
            --receipt "$RUNNER_TEMP/source-binding/receipt.json" \
            --evidence "$RUNNER_TEMP/source-binding/evidence.json" \
            --artifact "$GITHUB_WORKSPACE/evidence/real-trivy/requirements.txt" \
            > "$RUNNER_TEMP/source-binding/policy.json"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Assert source_binding mismatch is blocked end to end
        env:
          CORE_CODE: ${{ steps.core.outputs.code }}
          POLICY_CODE: ${{ steps.policy.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          python - \
            "$RUNNER_TEMP/source-binding" \
            "$CORE_CODE" "$POLICY_CODE" \
            "$RUNNER_TEMP/source-binding/source-binding-acceptance-manifest.json" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          out, core_code, policy_code, manifest_path = sys.argv[1:]
          out = Path(out)
          receipt = json.loads((out / "receipt.json").read_text(encoding="utf-8"))
          evidence = json.loads((out / "evidence.json").read_text(encoding="utf-8"))
          policy = json.loads((out / "policy.json").read_text(encoding="utf-8"))
          core = json.loads((out / "core.json").read_text(encoding="utf-8"))
          execution = evidence["scanner_execution"]

          def parse_timestamp(value: str) -> datetime:
              normalized = value[:-1] + "+00:00" if value.endswith("Z") else value
              parsed = datetime.fromisoformat(normalized)
              assert parsed.tzinfo is not None
              return parsed.astimezone(timezone.utc)

          assert os.environ["EVALUATION_TIMESTAMP_SOURCE"] == "runtime_after_producer"
          assert parse_timestamp(os.environ["CORE_EVALUATION_NOW"]) >= parse_timestamp(receipt["scanned_at"])

          assert receipt["verdict"] == "inconclusive"
          assert execution["completeness_status"] == "incomplete"
          assert execution["failed_components"] == ["source_binding"]
          assert execution["completeness_reason"] == "artifact_ref_mismatch"
          assert policy["integrity"] == "pass"
          assert policy["admission"] == "blocked"
          assert int(policy_code) == 2
          assert core["receiptVerdict"] == "inconclusive"
          assert core["decision"] == "fail"
          assert core["integrity_status"] == "pass"
          assert core["receipt_status"] == "valid"
          assert core["scanner_execution_status"] == "incomplete"
          assert "scanner_execution_incomplete" in core["reason_codes"]
          assert "receipt_inconclusive" in core["reason_codes"]
          assert int(core_code) == 1

          def digest(path: Path) -> str:
              return "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()

          manifest = {
              "schema_version": "dogfood-osv-source-binding-acceptance-v1",
              "dogfood_commit": os.environ["GITHUB_SHA"],
              "producer_sha": os.environ["PRODUCER_SHA"],
              "core_sha": os.environ["GATE_SHA"],
              "producer_receipt_digest": digest(out / "receipt.json"),
              "producer_evidence_digest": digest(out / "evidence.json"),
              "producer_scanned_at": receipt["scanned_at"],
              "core_evaluation_now": os.environ["CORE_EVALUATION_NOW"],
              "evaluation_timestamp_source": os.environ["EVALUATION_TIMESTAMP_SOURCE"],
              "receipt_verdict": receipt["verdict"],
              "scanner_execution": execution,
              "policy": policy,
              "policy_exit_code": int(policy_code),
              "core": core,
              "core_exit_code": int(core_code),
              "overall_admission": "blocked",
          }
          (out / "source-binding-acceptance-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          {
            echo "## OSV source_binding mismatch acceptance"
            echo
            echo "Producer classified a report bound to the wrong source path as incomplete/inconclusive."
            echo "Producer scanned_at: \`$PRODUCER_SCANNED_AT\`"
            echo "Core evaluation now: \`$CORE_EVALUATION_NOW\`"
            echo "evaluation_now >= scanned_at: \`PASS\` (runtime_after_producer)"
            echo "Dogfood policy admission is \`blocked\` (exit \`$POLICY_CODE\`); Core strict decision is \`fail\` (exit \`$CORE_CODE\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source_binding acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-osv-source-binding-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/source-binding
