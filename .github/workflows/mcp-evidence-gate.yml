name: MCP Evidence Gate Dogfood

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  verify-evidence:
    name: case (${{ matrix.name }}, ${{ matrix.receipt }}, ${{ matrix.expected_decision }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: matching-clean
            receipt: evidence/clean/receipt.json
            policy: permissive
            expected_decision: pass
            expected_verdict: clean
            expected_outcome: success
          - name: warnings-permissive
            receipt: evidence/warnings/permissive.json
            policy: permissive
            expected_decision: warn
            expected_verdict: warnings
            expected_outcome: success
          - name: warnings-strict
            receipt: evidence/warnings/strict.json
            policy: strict-release-example
            expected_decision: fail
            expected_verdict: warnings
            expected_outcome: failure
          - name: digest-mismatch
            receipt: evidence/inconclusive/receipt.json
            policy: permissive
            expected_decision: inconclusive
            expected_verdict: clean
            expected_outcome: failure
          - name: stale
            receipt: evidence/inconclusive/stale.json
            policy: permissive
            expected_decision: inconclusive
            expected_verdict: clean
            expected_outcome: failure
          - name: findings
            receipt: evidence/fail/findings.json
            policy: permissive
            expected_decision: fail
            expected_verdict: findings
            expected_outcome: failure
          - name: malformed-receipt
            receipt: evidence/fail/malformed.json
            policy: permissive
            expected_decision: fail
            expected_outcome: failure
            expected_verdict: clean
          - name: explicit-evidence-match-permissive
            receipt: evidence/clean/evidence-match-receipt.json
            evidence: evidence/clean/evidence-report.json
            policy: permissive
            expected_decision: pass
            expected_verdict: clean
            expected_outcome: success
          - name: explicit-evidence-mismatch-permissive
            receipt: evidence/inconclusive/evidence-mismatch-receipt.json
            evidence: evidence/clean/evidence-report.json
            policy: permissive
            expected_decision: inconclusive
            expected_verdict: clean
            expected_outcome: failure
          - name: malformed-optional-evidence-digest
            receipt: evidence/fail/malformed-optional-evidence-digest.json
            policy: permissive
            expected_decision: fail
            expected_verdict: clean
            expected_outcome: failure
          - name: unrequested-unsupported-evidence-digest
            receipt: evidence/clean/unrequested-unsupported-evidence-digest.json
            policy: permissive
            expected_decision: pass
            expected_verdict: clean
            expected_outcome: success

    steps:
      - uses: actions/checkout@v4

      - name: Verify ${{ matrix.name }}
        id: evidence
        continue-on-error: true
        uses: yandexuanxuan/mcp-evidence-gate@c5467b94d9bc80c4728cceabfe567ef78ff1fa0c
        with:
          receipt: ${{ matrix.receipt }}
          artifact: dist/example-artifact.bin
          policy: ${{ matrix.policy }}
          evidence: ${{ matrix.evidence }}

      - name: Assert expected decision
        if: always()
        run: |
          echo "decision=${{ steps.evidence.outputs.decision }}"
          echo "receipt-verdict=${{ steps.evidence.outputs.receipt-verdict }}"
          echo "profile=${{ steps.evidence.outputs.profile }}"
          echo "outcome=${{ steps.evidence.outcome }}"
          test "${{ steps.evidence.outputs.decision }}" = "${{ matrix.expected_decision }}"
          test "${{ steps.evidence.outputs.receipt-verdict }}" = "${{ matrix.expected_verdict }}"
          test "${{ steps.evidence.outputs.profile }}" = "registry-pr-1404@20747d3253ba8638161dd95f1cec70df02993c22"
          test "${{ steps.evidence.outcome }}" = "${{ matrix.expected_outcome }}"

  real-trivy-promotion:
    name: real-trivy-promotion
    uses: ./.github/workflows/real-trivy-producer.yml

  real-osv-promotion:
    name: real-osv-promotion
    uses: ./.github/workflows/real-osv-producer.yml

  real-multi-receipt-promotion:
    name: real-multi-receipt-promotion
    uses: ./.github/workflows/real-multi-receipt-composition.yml

  real-oci-identity-promotion:
    name: real-oci-identity-promotion
    uses: ./.github/workflows/real-oci-identity.yml

  scanner-completeness-promotion:
    name: scanner-completeness-promotion
    uses: ./.github/workflows/scanner-completeness-consumer.yml

  promotion-gate:
    name: promotion-gate
    if: always()
    needs:
      - verify-evidence
      - real-trivy-promotion
      - real-osv-promotion
      - real-multi-receipt-promotion
      - real-oci-identity-promotion
      - scanner-completeness-promotion
    runs-on: ubuntu-latest
    steps:
      - name: Require all declared acceptance evidence
        env:
          MATRIX_RESULT: ${{ needs.verify-evidence.result }}
          REAL_TRIVY_RESULT: ${{ needs.real-trivy-promotion.result }}
          REAL_OSV_RESULT: ${{ needs.real-osv-promotion.result }}
          REAL_COMPOSITION_RESULT: ${{ needs.real-multi-receipt-promotion.result }}
          REAL_OCI_IDENTITY_RESULT: ${{ needs.real-oci-identity-promotion.result }}
          SCANNER_COMPLETENESS_RESULT: ${{ needs.scanner-completeness-promotion.result }}
        run: |
          set -euo pipefail
          echo "deterministic_matrix=$MATRIX_RESULT"
          echo "real_trivy_consumer=$REAL_TRIVY_RESULT"
          echo "real_osv_consumer=$REAL_OSV_RESULT"
          echo "real_multi_receipt_composition=$REAL_COMPOSITION_RESULT"
          echo "real_oci_exact_identity=$REAL_OCI_IDENTITY_RESULT"
          echo "scanner_completeness_consumer=$SCANNER_COMPLETENESS_RESULT"
          test "$MATRIX_RESULT" = success
          test "$REAL_TRIVY_RESULT" = success
          test "$REAL_OSV_RESULT" = success
          test "$REAL_COMPOSITION_RESULT" = success
          test "$REAL_OCI_IDENTITY_RESULT" = success
          test "$SCANNER_COMPLETENESS_RESULT" = success

  legacy-required-context-anchor:
    if: always()
    needs:
      - promotion-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: matching-clean
            receipt: evidence/clean/receipt.json
            expected_decision: pass
          - name: digest-mismatch
            receipt: evidence/inconclusive/receipt.json
            expected_decision: inconclusive
          - name: stale
            receipt: evidence/inconclusive/stale.json
            expected_decision: inconclusive
          - name: findings
            receipt: evidence/fail/findings.json
            expected_decision: fail
          - name: malformed-receipt
            receipt: evidence/fail/malformed.json
            expected_decision: fail
    name: verify-evidence (${{ matrix.name }}, ${{ matrix.receipt }}, ${{ matrix.expected_decision }})
    steps:
      - name: Bridge existing branch protection to full promotion gate
        env:
          PROMOTION_GATE_RESULT: ${{ needs.promotion-gate.result }}
        run: |
          set -euo pipefail
          echo "promotion_gate=$PROMOTION_GATE_RESULT"
          test "$PROMOTION_GATE_RESULT" = success
